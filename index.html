  'En conclusión, Python es una de las mejores opciones para un estudiante de ingeniería por ser gratuito, potente y fácil de aprender.');
C('matlab-que', '¿Qué es MATLAB?', 'matlab octave simulink',
  '<b>MATLAB</b> (MATrix LABoratory) es un software y lenguaje de programación especializado en cálculo con matrices, análisis numérico, simulación y visualización.',
  ['Se usa mucho en ingeniería mecánica para vibraciones, control, análisis de señales y simulación (con Simulink). <b>GNU Octave</b> es una alternativa gratuita casi compatible.'],
  'En conclusión, MATLAB es una herramienta estándar en la industria y la universidad para resolver problemas de ingeniería.');
C('c-que', '¿Qué es el lenguaje C / C++?', 'lenguaje c c++ cpp',
  '<b>C</b> es un lenguaje compilado de nivel medio, muy rápido y cercano al hardware; <b>C++</b> es su extensión con programación orientada a objetos.',
  ['Se usan en sistemas operativos, videojuegos, software de simulación y en microcontroladores (Arduino se programa en C/C++). Exigen declarar el tipo de cada variable y manejar la memoria con cuidado.'],
  'En conclusión, C/C++ es ideal cuando se necesita velocidad y control directo del hardware.');
C('ia', '¿Qué es la inteligencia artificial?', 'inteligencia artificial ia machine learning aprendizaje automatico',
  'La <b>inteligencia artificial (IA)</b> es la rama de la informática que crea sistemas capaces de realizar tareas que normalmente requieren inteligencia humana: reconocer imágenes, entender lenguaje, aprender de datos y tomar decisiones.',
  ['El <b>aprendizaje automático</b> (machine learning) permite que un programa aprenda patrones a partir de ejemplos en lugar de programarle cada regla. En ingeniería mecánica se usa para mantenimiento predictivo, control de calidad por visión y optimización de diseños.'],
  'En conclusión, la IA es una herramienta que amplía lo que el software puede hacer, siempre apoyada en matemáticas (álgebra lineal, cálculo y estadística).');
C('cad-cae', '¿Qué es CAD, CAM y CAE?', 'cad cam cae solidworks autocad ansys elementos finitos',
  '<b>CAD</b> (diseño asistido por computadora), <b>CAM</b> (manufactura asistida) y <b>CAE</b> (ingeniería asistida) son tipos de software que apoyan el ciclo de vida de un producto mecánico.',
  ['Con CAD (AutoCAD, SolidWorks, Inventor, Fusion 360) se dibujan piezas en 2D/3D; con CAE (ANSYS, Abaqus) se simulan esfuerzos, temperaturas y fluidos con el método de elementos finitos; con CAM se generan las trayectorias para máquinas CNC.'],
  'En conclusión, estas herramientas permiten diseñar, probar y fabricar piezas sin tener que construir prototipos costosos.');
C('internet', '¿Qué es internet?', 'internet red web protocolo',
  '<b>Internet</b> es una red mundial que conecta millones de computadoras y dispositivos para intercambiar información.',
  ['Funciona con protocolos comunes (TCP/IP). Sobre internet funcionan servicios como la web (páginas), el correo electrónico y la mensajería. El “Internet de las cosas” (IoT) conecta sensores y máquinas industriales para monitorearlos a distancia.'],
  'En conclusión, internet es la infraestructura que hace posible la comunicación y el acceso a la información en todo el mundo.');
C('git', '¿Qué es Git y el control de versiones?', 'git github control versiones',
  '<b>Git</b> es un sistema de control de versiones: guarda el historial de cambios de los archivos de un proyecto.',
  ['Permite volver a versiones anteriores, trabajar en equipo sin borrar el trabajo de otros y ver quién cambió qué. GitHub y GitLab son sitios web donde se alojan proyectos que usan Git.'],
  'En conclusión, Git es indispensable para organizar cualquier proyecto de software, incluso uno personal.');
})(window);

</script>
<script>
/* Biblioteca: Taller de Matemática III (Prof. Jesús Carvajal) */
(function (G) {
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const L=(a)=>`<span class="lim">lím<small>x→${a}</small></span>`;
const I=(a,b)=>`<span class="ig">∫</span>${a!==undefined?`<span class="bd"><sup>${b}</sup><sub>${a}</sub></span>`:''}`;
const H=(t)=>`<span class="hl">${t}</span>`;
const sq='√';
const DATA={
lim:{titulo:'Parte I: Límites',intro:'Toca un ejercicio y luego <b>“Siguiente paso”</b> para ver cómo se resuelve, uno a uno. Cada paso dice <b>de dónde sale</b>.',ej:[
{l:'a',tag:'Sustitución directa',p:`${L(3)} ${F('4x + 2','3x − 5')}`,
 steps:[
 {w:'Primero se intenta sustituir x = 3 directamente.',m:`${F('4(3) + 2','3(3) − 5')}`,
  y:'Es un cociente de polinomios (función racional). Estas funciones son continuas en todo punto donde el denominador NO sea cero, y en ese caso el límite es simplemente el valor de la función en el punto.'},
 {w:'Calculamos el numerador.',m:`4(3) + 2 = 12 + 2 = ${H('14')}`,
  y:'Se reemplaza x por 3: primero la multiplicación 4·3 = 12 (jerarquía de operaciones) y luego se suma 2.'},
 {w:'Calculamos el denominador.',m:`3(3) − 5 = 9 − 5 = ${H('4')}`,
  y:'3·3 = 9 y luego 9 − 5 = 4. Como 4 ≠ 0, no hay indeterminación: la sustitución directa es válida.'},
 {w:'Formamos la fracción y simplificamos.',m:`${F('14','4')} = ${F('14 ÷ 2','4 ÷ 2')} = ${F('7','2')}`,
  y:'El máximo común divisor de 14 y 4 es 2. Dividimos arriba y abajo entre 2 para simplificar.'}
 ],r:`${L(3)} ${F('4x + 2','3x − 5')} = ${F('7','2')}`,rs:'= 3,5'},

{l:'b',tag:'Sustitución directa',p:`${L(4)} ${F('x² − 16','x + 5')}`,
 steps:[
 {w:'Sustituimos x = 4 directamente.',m:`${F('4² − 16','4 + 5')}`,
  y:'Es una función racional; si el denominador no da cero en x = 4, el límite es el valor de la función en 4.'},
 {w:'Numerador.',m:`4² − 16 = 16 − 16 = ${H('0')}`,
  y:'4² significa 4·4 = 16. Luego 16 − 16 = 0.'},
 {w:'Denominador.',m:`4 + 5 = ${H('9')}`,
  y:'Da 9, que NO es cero. Por eso no hay indeterminación (sería indeterminado sólo si fuera 0/0).'},
 {w:'Dividimos.',m:`${F('0','9')} = 0`,
  y:'Cero dividido entre cualquier número distinto de cero es cero.'}
 ],r:`${L(4)} ${F('x² − 16','x + 5')} = 0`},

{l:'c',tag:'Indeterminación 0/0 · factorización',p:`${L(3)} ${F('x − 3','x² − 9')}`,
 steps:[
 {w:'Intentamos sustituir x = 3.',m:`${F('3 − 3','3² − 9')} = ${F('0','0')}`,
  y:'0/0 es una INDETERMINACIÓN: no significa 0 ni 1, sólo indica que hay que transformar la expresión antes de sustituir.'},
 {w:'Factorizamos el denominador como diferencia de cuadrados.',m:`x² − 9 = x² − 3² = ${H('(x − 3)(x + 3)')}`,
  y:'Fórmula de diferencia de cuadrados: a² − b² = (a − b)(a + b). Aquí a = x y b = 3, porque 9 = 3².'},
 {w:'Reescribimos el límite con el denominador factorizado.',m:`${L(3)} ${F('(x − 3)','(x − 3)(x + 3)')}`,
  y:'Sólo cambiamos x² − 9 por su forma factorizada; la expresión es la misma.'},
 {w:'Cancelamos el factor común (x − 3).',m:`${L(3)} ${F('1','x + 3')}`,
  y:'Se puede cancelar porque x se ACERCA a 3 pero nunca vale exactamente 3, así que (x − 3) ≠ 0. Al dividir (x − 3)/(x − 3) = 1, arriba queda 1.'},
 {w:'Ahora sí sustituimos x = 3.',m:`${F('1','3 + 3')} = ${F('1','6')}`,
  y:'Ya no hay división entre cero: 3 + 3 = 6.'}
 ],r:`${L(3)} ${F('x − 3','x² − 9')} = ${F('1','6')}`},

{l:'d',tag:'Límite al infinito',p:`${L('∞')} ${F('5x² − 3x','2 + x + 10x')}`,
 steps:[
 {w:'Simplificamos el denominador sumando términos semejantes.',m:`2 + x + 10x = ${H('11x + 2')}`,
  y:'x y 10x son términos semejantes (ambos tienen x¹): 1x + 10x = 11x. El 2 queda igual.'},
 {w:'La expresión queda así:',m:`${L('∞')} ${F('5x² − 3x','11x + 2')}`,
  y:'Sólo reemplazamos el denominador simplificado.'},
 {w:'Comparamos los grados.',m:`grado del numerador = 2 &nbsp;&gt;&nbsp; grado del denominador = 1`,
  y:'Regla para límites al infinito de cocientes de polinomios: si el grado de arriba es MAYOR que el de abajo, el límite es ±∞. Si son iguales, es el cociente de los coeficientes principales. Si el de arriba es menor, es 0.'},
 {w:'Lo comprobamos dividiendo numerador y denominador entre x.',m:`${F('5x² ÷ x − 3x ÷ x','11x ÷ x + 2 ÷ x')} = ${F('5x − 3','11 + 2/x')}`,
  y:'Dividir arriba y abajo por lo mismo no cambia la fracción. 5x²/x = 5x; 3x/x = 3; 11x/x = 11; 2 queda como 2/x.'},
 {w:'Analizamos el denominador cuando x → ∞.',m:`${F('2','x')} → 0 &nbsp;⇒&nbsp; 11 + ${F('2','x')} → 11`,
  y:'Un número fijo (2) dividido entre algo cada vez más grande se hace cada vez más pequeño, se acerca a 0.'},
 {w:'Analizamos el numerador.',m:`5x − 3 → +∞`,
  y:'Si x crece sin límite, 5x también, y restarle 3 no lo detiene. Algo que crece sin fin dividido entre 11 sigue creciendo sin fin.'}
 ],r:`${L('∞')} ${F('5x² − 3x','2 + x + 10x')} = +∞`,
 note:'Nota: si en tu hoja el denominador fuera 2 + x² + 10x (con x al cuadrado), los grados serían iguales (2 y 2) y el límite sería el cociente de coeficientes principales: 5/1 = 5. Revísalo con el profesor.'}
]},

der:{titulo:'Parte II: Derivadas',intro:`Los ejercicios a, b y c se resuelven <b>por definición</b>: &nbsp;f′(x) = ${L('').replace('x→','h→0')} ${F('f(x + h) − f(x)','h')}. Los demás con <b>reglas de derivación</b>.`,ej:[
{l:'a',tag:'Por definición',p:`f(x) = 3x + 5`,
 steps:[
 {w:'Escribimos la definición de derivada.',m:`f′(x) = <span class="lim">lím<small>h→0</small></span> ${F('f(x + h) − f(x)','h')}`,
  y:'El enunciado pide resolver por la definición. Esta fórmula mide la pendiente de la recta tangente: cambio en y entre cambio en x, con un cambio h que se hace cero.'},
 {w:'Calculamos f(x + h).',m:`f(x + h) = 3(x + h) + 5 = ${H('3x + 3h + 5')}`,
  y:'Donde dice x en f(x) = 3x + 5 se escribe (x + h). Luego se aplica la propiedad distributiva: 3·x + 3·h.'},
 {w:'Restamos f(x).',m:`(3x + 3h + 5) − (3x + 5) = 3x + 3h + 5 − 3x − 5 = ${H('3h')}`,
  y:'El signo menos cambia el signo de cada término del segundo paréntesis. 3x − 3x = 0 y 5 − 5 = 0; sólo queda 3h.'},
 {w:'Dividimos entre h.',m:`${F('3h','h')} = 3`,
  y:'h/h = 1 (h ≠ 0 mientras tiende a cero).'},
 {w:'Tomamos el límite cuando h → 0.',m:`<span class="lim">lím<small>h→0</small></span> 3 = 3`,
  y:'El límite de una constante es la misma constante: ya no hay h.'}
 ],r:`f′(x) = 3`},

{l:'b',tag:'Por definición',p:`f(x) = 2x + 4`,
 steps:[
 {w:'Definición de derivada.',m:`f′(x) = <span class="lim">lím<small>h→0</small></span> ${F('f(x + h) − f(x)','h')}`,
  y:'Se pide resolver por definición.'},
 {w:'Calculamos f(x + h).',m:`f(x + h) = 2(x + h) + 4 = ${H('2x + 2h + 4')}`,
  y:'Se cambia x por (x + h) y se distribuye el 2.'},
 {w:'Restamos f(x).',m:`(2x + 2h + 4) − (2x + 4) = ${H('2h')}`,
  y:'2x − 2x = 0 y 4 − 4 = 0. Queda 2h.'},
 {w:'Dividimos entre h.',m:`${F('2h','h')} = 2`,
  y:'Se cancela h.'},
 {w:'Límite cuando h → 0.',m:`<span class="lim">lím<small>h→0</small></span> 2 = 2`,
  y:'Límite de una constante.'}
 ],r:`f′(x) = 2`},

{l:'c',tag:'Por definición',p:`f(x) = x² − 4x − 5`,
 steps:[
 {w:'Definición de derivada.',m:`f′(x) = <span class="lim">lím<small>h→0</small></span> ${F('f(x + h) − f(x)','h')}`,
  y:'Se pide resolver por definición.'},
 {w:'Calculamos f(x + h).',m:`f(x + h) = (x + h)² − 4(x + h) − 5`,
  y:'En cada lugar donde aparece x se coloca (x + h).'},
 {w:'Desarrollamos.',m:`= ${H('x² + 2xh + h²')} − 4x − 4h − 5`,
  y:'Binomio al cuadrado: (a + b)² = a² + 2ab + b², con a = x, b = h. Y −4(x + h) = −4x − 4h por distributiva.'},
 {w:'Restamos f(x).',m:`(x² + 2xh + h² − 4x − 4h − 5) − (x² − 4x − 5) = ${H('2xh + h² − 4h')}`,
  y:'Se cancelan: x² − x² = 0, −4x + 4x = 0, −5 + 5 = 0. Sobreviven sólo los términos que tienen h.'},
 {w:'Sacamos h como factor común.',m:`2xh + h² − 4h = h(2x + h − 4)`,
  y:'Los tres términos tienen h; se “saca” h y dentro queda lo que multiplica a cada uno.'},
 {w:'Dividimos entre h.',m:`${F('h(2x + h − 4)','h')} = 2x + h − 4`,
  y:'Se cancela la h de arriba con la de abajo. Por eso factorizamos: para poder eliminar la h del denominador.'},
 {w:'Límite cuando h → 0.',m:`<span class="lim">lím<small>h→0</small></span> (2x + h − 4) = 2x + 0 − 4 = 2x − 4`,
  y:'Ahora sí se puede sustituir h = 0 sin problema.'}
 ],r:`f′(x) = 2x − 4`},

{l:'d',tag:'Regla de la potencia',p:`f(x) = 7x³ + 3x² − x + 1`,
 steps:[
 {w:'Derivamos término a término.',m:`f′(x) = (7x³)′ + (3x²)′ − (x)′ + (1)′`,
  y:'La derivada de una suma/resta es la suma/resta de las derivadas.'},
 {w:'Derivamos 7x³.',m:`(7x³)′ = 7·3x<sup>3−1</sup> = ${H('21x²')}`,
  y:'Regla de la potencia: (xⁿ)′ = n·xⁿ⁻¹. El exponente 3 “baja” a multiplicar al 7 (7·3 = 21) y el exponente baja en 1 (3 − 1 = 2).'},
 {w:'Derivamos 3x².',m:`(3x²)′ = 3·2x<sup>2−1</sup> = ${H('6x')}`,
  y:'Igual: 3·2 = 6 y el exponente queda 2 − 1 = 1, es decir x.'},
 {w:'Derivamos −x.',m:`(−x)′ = −1`,
  y:'x = x¹, entonces (x¹)′ = 1·x⁰ = 1. Con el signo menos queda −1.'},
 {w:'Derivamos la constante 1.',m:`(1)′ = 0`,
  y:'La derivada de cualquier constante es 0 (una constante no cambia).'},
 {w:'Juntamos todo.',m:`f′(x) = 21x² + 6x − 1 + 0`,
  y:'Se suman los resultados de cada término.'}
 ],r:`f′(x) = 21x² + 6x − 1`},

{l:'e',tag:'Exponentes negativos',p:`f(x) = ${F('−6','x³')} + ${F('1','x²')}`,
 steps:[
 {w:'Reescribimos con exponentes negativos.',m:`f(x) = −6x<sup>−3</sup> + x<sup>−2</sup>`,
  y:'Propiedad: 1/xⁿ = x⁻ⁿ. Así −6/x³ = −6x⁻³ y 1/x² = x⁻². Ahora se puede usar la regla de la potencia.'},
 {w:'Derivamos −6x⁻³.',m:`(−6x<sup>−3</sup>)′ = −6·(−3)x<sup>−3−1</sup> = ${H('18x<sup>−4</sup>')}`,
  y:'Regla (xⁿ)′ = n·xⁿ⁻¹ con n = −3. Menos por menos da más: −6·(−3) = 18. Exponente: −3 − 1 = −4.'},
 {w:'Derivamos x⁻².',m:`(x<sup>−2</sup>)′ = −2x<sup>−2−1</sup> = ${H('−2x<sup>−3</sup>')}`,
  y:'Con n = −2: baja el −2 y el exponente queda −2 − 1 = −3.'},
 {w:'Volvemos a escribir como fracciones.',m:`18x<sup>−4</sup> − 2x<sup>−3</sup> = ${F('18','x⁴')} − ${F('2','x³')}`,
  y:'Se usa al revés la propiedad: x⁻ⁿ = 1/xⁿ.'}
 ],r:`f′(x) = ${F('18','x⁴')} − ${F('2','x³')}`},

{l:'f',tag:'Raíces → exponentes fraccionarios',p:`f(x) = 3${sq}x + ∛x`,
 steps:[
 {w:'Reescribimos las raíces como potencias.',m:`f(x) = 3x<sup>1/2</sup> + x<sup>1/3</sup>`,
  y:'Propiedad: ⁿ√x = x<sup>1/n</sup>. La raíz cuadrada es exponente 1/2 y la raíz cúbica es exponente 1/3.'},
 {w:'Derivamos 3x^(1/2).',m:`3·${F('1','2')}x<sup>1/2 − 1</sup> = ${H(`${F('3','2')}x<sup>−1/2</sup>`)}`,
  y:'Regla de la potencia con n = 1/2. Exponente nuevo: 1/2 − 1 = 1/2 − 2/2 = −1/2.'},
 {w:'Derivamos x^(1/3).',m:`${F('1','3')}x<sup>1/3 − 1</sup> = ${H(`${F('1','3')}x<sup>−2/3</sup>`)}`,
  y:'Con n = 1/3. Exponente nuevo: 1/3 − 1 = 1/3 − 3/3 = −2/3.'},
 {w:'Volvemos a forma de raíz.',m:`${F('3','2')}x<sup>−1/2</sup> = ${F('3',`2${sq}x`)} &nbsp;&nbsp; ${F('1','3')}x<sup>−2/3</sup> = ${F('1','3∛x²')}`,
  y:'El exponente negativo manda la potencia al denominador, y x<sup>1/2</sup> = √x, x<sup>2/3</sup> = ∛(x²).'}
 ],r:`f′(x) = ${F('3',`2${sq}x`)} + ${F('1','3∛x²')}`},

{l:'g',tag:'Exponencial · regla de la cadena',p:`F(x) = 3e<sup>2x</sup>`,
 steps:[
 {w:'La constante 3 se mantiene.',m:`F′(x) = 3·(e<sup>2x</sup>)′`,
  y:'Regla: (k·g(x))′ = k·g′(x). Las constantes que multiplican salen de la derivada.'},
 {w:'Identificamos la función interna.',m:`u = 2x &nbsp;⇒&nbsp; u′ = 2`,
  y:'El exponente no es sólo x sino 2x, así que hay una función “dentro” de otra. La derivada de 2x es 2.'},
 {w:'Aplicamos la regla de la cadena para la exponencial.',m:`(e<sup>u</sup>)′ = e<sup>u</sup>·u′ = e<sup>2x</sup>·2`,
  y:'La derivada de eᵘ es la misma eᵘ multiplicada por la derivada de lo de arriba (u′).'},
 {w:'Multiplicamos.',m:`F′(x) = 3·e<sup>2x</sup>·2 = 6e<sup>2x</sup>`,
  y:'3·2 = 6.'}
 ],r:`F′(x) = 6e<sup>2x</sup>`},

{l:'h',tag:'Regla del producto',p:`f(x) = (3x² + 5x − 2)·(2x³ − 3x)`,
 steps:[
 {w:'Llamamos u al primer factor y lo derivamos.',m:`u = 3x² + 5x − 2 &nbsp;⇒&nbsp; ${H("u′ = 6x + 5")}`,
  y:'Regla de la potencia: 3x² → 6x; 5x → 5; −2 → 0.'},
 {w:'Llamamos v al segundo factor y lo derivamos.',m:`v = 2x³ − 3x &nbsp;⇒&nbsp; ${H("v′ = 6x² − 3")}`,
  y:'2x³ → 2·3x² = 6x²; −3x → −3.'},
 {w:'Aplicamos la regla del producto.',m:`(u·v)′ = u′·v + u·v′<br>f′(x) = (6x + 5)(2x³ − 3x) + (3x² + 5x − 2)(6x² − 3)`,
  y:'Fórmula del producto: derivada del primero por el segundo sin derivar, MÁS el primero sin derivar por la derivada del segundo.'},
 {w:'Primer producto (distributiva).',m:`(6x + 5)(2x³ − 3x) = 12x⁴ − 18x² + 10x³ − 15x<br>= ${H('12x⁴ + 10x³ − 18x² − 15x')}`,
  y:'Cada término del primer paréntesis multiplica a cada uno del segundo: 6x·2x³ = 12x⁴; 6x·(−3x) = −18x²; 5·2x³ = 10x³; 5·(−3x) = −15x. Al multiplicar potencias se SUMAN exponentes.'},
 {w:'Segundo producto (distributiva).',m:`(3x² + 5x − 2)(6x² − 3) = 18x⁴ − 9x² + 30x³ − 15x − 12x² + 6<br>= ${H('18x⁴ + 30x³ − 21x² − 15x + 6')}`,
  y:'3x²·6x² = 18x⁴; 3x²·(−3) = −9x²; 5x·6x² = 30x³; 5x·(−3) = −15x; −2·6x² = −12x²; −2·(−3) = +6. Luego −9x² − 12x² = −21x².'},
 {w:'Sumamos ambos resultados agrupando términos semejantes.',m:`x⁴: 12 + 18 = 30 &nbsp;|&nbsp; x³: 10 + 30 = 40 &nbsp;|&nbsp; x²: −18 − 21 = −39 &nbsp;|&nbsp; x: −15 − 15 = −30 &nbsp;|&nbsp; cte: 6`,
  y:'Sólo se suman términos con la misma potencia de x.'}
 ],r:`f′(x) = 30x⁴ + 40x³ − 39x² − 30x + 6`},

{l:'i',tag:'Trigonométricas · regla de la cadena',p:`f(x) = 2 sen(3x) − 4 tan(x²)`,
 steps:[
 {w:'Separamos en dos términos.',m:`f′(x) = [2 sen(3x)]′ − [4 tan(x²)]′`,
  y:'Derivada de una resta = resta de derivadas.'},
 {w:'Derivamos 2 sen(3x).',m:`2·cos(3x)·(3x)′ = 2·cos(3x)·3 = ${H('6 cos(3x)')}`,
  y:'(sen u)′ = cos u · u′ (regla de la cadena). Aquí u = 3x, u′ = 3. Luego 2·3 = 6.'},
 {w:'Derivamos 4 tan(x²).',m:`4·sec²(x²)·(x²)′ = 4·sec²(x²)·2x = ${H('8x sec²(x²)')}`,
  y:'(tan u)′ = sec²u · u′. Aquí u = x², u′ = 2x. Luego 4·2x = 8x.'},
 {w:'Restamos los dos resultados.',m:`f′(x) = 6 cos(3x) − 8x sec²(x²)`,
  y:'Se conserva el signo menos que tenía el segundo término.'},
 {w:'(Forma equivalente)',m:`sec²(x²) = ${F('1','cos²(x²)')} &nbsp;⇒&nbsp; f′(x) = 6 cos(3x) − ${F('8x','cos²(x²)')}`,
  y:'La secante es el inverso del coseno: sec u = 1/cos u. Ambas respuestas son correctas.'}
 ],r:`f′(x) = 6 cos(3x) − 8x sec²(x²)`}
]},

int:{titulo:'Parte III: Integrales',intro:`Regla básica: ${I()} xⁿ dx = ${F('xⁿ⁺¹','n + 1')} + C &nbsp;(n ≠ −1). En las definidas se usa F(b) − F(a).`,ej:[
{l:'a',tag:'Indefinida',p:`${I()} (2x³ + 5x² − 2x + 1) dx`,
 steps:[
 {w:'Integramos término a término.',m:`${I()}2x³dx + ${I()}5x²dx − ${I()}2x dx + ${I()}1 dx`,
  y:'La integral de una suma es la suma de las integrales, y las constantes que multiplican pueden salir de la integral.'},
 {w:'Integramos 2x³.',m:`2·${F('x<sup>3+1</sup>','3+1')} = 2·${F('x⁴','4')} = ${H(F('x⁴','2'))}`,
  y:'Regla: se SUMA 1 al exponente (3 + 1 = 4) y se DIVIDE entre el nuevo exponente (4). Luego 2/4 = 1/2.'},
 {w:'Integramos 5x².',m:`5·${F('x<sup>2+1</sup>','2+1')} = ${H(F('5x³','3'))}`,
  y:'Exponente 2 + 1 = 3, se divide entre 3.'},
 {w:'Integramos −2x.',m:`−2·${F('x²','2')} = ${H('−x²')}`,
  y:'x = x¹; exponente 1 + 1 = 2, se divide entre 2. Luego −2/2 = −1.'},
 {w:'Integramos 1.',m:`${I()}1 dx = ${H('x')}`,
  y:'La integral de una constante k es k·x.'},
 {w:'Juntamos y sumamos la constante C.',m:`${F('x⁴','2')} + ${F('5x³','3')} − x² + x + C`,
  y:'En las integrales indefinidas siempre se suma C, porque la derivada de cualquier constante es 0 (hay infinitas primitivas).'}
 ],r:`${F('x⁴','2')} + ${F('5x³','3')} − x² + x + C`},

{l:'b',tag:'Indefinida · dividir primero',p:`${I()} ${F('6x⁵ − 12x⁴ + 3x³','3x²')} dx`,
 steps:[
 {w:'Dividimos cada término del numerador entre 3x².',m:`${F('6x⁵','3x²')} − ${F('12x⁴','3x²')} + ${F('3x³','3x²')}`,
  y:'No hay regla directa para integrar un cociente, pero como el denominador es un solo término (monomio), se puede repartir entre cada término de arriba.'},
 {w:'Simplificamos cada fracción.',m:`${H('2x³ − 4x² + x')}`,
  y:'Se dividen los coeficientes (6/3 = 2, 12/3 = 4, 3/3 = 1) y se RESTAN los exponentes (5−2 = 3, 4−2 = 2, 3−2 = 1).'},
 {w:'Integramos 2x³.',m:`2·${F('x⁴','4')} = ${F('x⁴','2')}`,
  y:'Exponente +1 y dividir entre él.'},
 {w:'Integramos −4x².',m:`−4·${F('x³','3')} = −${F('4x³','3')}`,
  y:'Exponente 2 + 1 = 3, dividir entre 3.'},
 {w:'Integramos x.',m:`${F('x²','2')}`,
  y:'Exponente 1 + 1 = 2, dividir entre 2.'}
 ],r:`${F('x⁴','2')} − ${F('4x³','3')} + ${F('x²','2')} + C`},

{l:'c',tag:'Indefinida · multiplicar primero',p:`${I()} (2x − 5)(3x² + 4x) dx`,
 steps:[
 {w:'Multiplicamos los paréntesis (distributiva).',m:`2x·3x² = 6x³; &nbsp; 2x·4x = 8x²; &nbsp; −5·3x² = −15x²; &nbsp; −5·4x = −20x`,
  y:'No se integra un producto factor por factor. Primero se convierte en un polinomio multiplicando cada término del primero por cada término del segundo.'},
 {w:'Agrupamos términos semejantes.',m:`6x³ + 8x² − 15x² − 20x = ${H('6x³ − 7x² − 20x')}`,
  y:'8x² − 15x² = −7x².'},
 {w:'Integramos 6x³.',m:`6·${F('x⁴','4')} = ${F('3','2')}x⁴`,
  y:'6/4 simplificado es 3/2.'},
 {w:'Integramos −7x².',m:`−7·${F('x³','3')} = −${F('7','3')}x³`,
  y:'Exponente 3, dividir entre 3.'},
 {w:'Integramos −20x.',m:`−20·${F('x²','2')} = −10x²`,
  y:'20/2 = 10.'}
 ],r:`${F('3','2')}x⁴ − ${F('7','3')}x³ − 10x² + C`},

{l:'d',tag:'Indefinida · desarrollar cuadrado',p:`${I()} (3x − 5)² dx`,
 steps:[
 {w:'Desarrollamos el binomio al cuadrado.',m:`(3x − 5)² = (3x)² − 2(3x)(5) + 5² = ${H('9x² − 30x + 25')}`,
  y:'Fórmula: (a − b)² = a² − 2ab + b², con a = 3x y b = 5. (3x)² = 9x²; 2·3x·5 = 30x; 5² = 25.'},
 {w:'Integramos 9x².',m:`9·${F('x³','3')} = 3x³`,
  y:'Exponente 2 + 1 = 3; 9/3 = 3.'},
 {w:'Integramos −30x.',m:`−30·${F('x²','2')} = −15x²`,
  y:'Exponente 1 + 1 = 2; 30/2 = 15.'},
 {w:'Integramos 25.',m:`25x`,
  y:'Integral de una constante: constante por x.'}
 ],r:`3x³ − 15x² + 25x + C`},

{l:'e',tag:'Definida',p:`${I(1,2)} (x² − 5x − 3) dx`,
 steps:[
 {w:'Buscamos la primitiva F(x).',m:`F(x) = ${F('x³','3')} − ${F('5x²','2')} − 3x`,
  y:'Se integra cada término con la regla de la potencia. En la integral definida NO se pone + C porque se cancela al restar.'},
 {w:'Aplicamos el Teorema Fundamental del Cálculo.',m:`${I(1,2)} f(x) dx = F(2) − F(1)`,
  y:'Se evalúa la primitiva en el límite de ARRIBA menos la primitiva en el límite de ABAJO.'},
 {w:'Calculamos F(2).',m:`${F('8','3')} − ${F('5·4','2')} − 6 = ${F('8','3')} − 10 − 6 = ${F('8','3')} − 16 = ${F('8 − 48','3')} = ${H(F('−40','3'))}`,
  y:'2³ = 8; 2² = 4 → 5·4/2 = 10; 3·2 = 6. Para restar 16 a 8/3 se escribe 16 = 48/3.'},
 {w:'Calculamos F(1).',m:`${F('1','3')} − ${F('5','2')} − 3 = ${F('2 − 15 − 18','6')} = ${H(F('−31','6'))}`,
  y:'1³ = 1, 1² = 1. Común denominador 6: 1/3 = 2/6, 5/2 = 15/6, 3 = 18/6.'},
 {w:'Restamos F(2) − F(1).',m:`${F('−40','3')} − (${F('−31','6')}) = ${F('−80','6')} + ${F('31','6')} = ${F('−49','6')}`,
  y:'Menos por menos da más. Se pasa −40/3 a sextos multiplicando arriba y abajo por 2: −80/6.'}
 ],r:`${F('−49','6')}`,rs:'≈ −8,17'},

{l:'f',tag:'Definida',p:`${I(-3,2)} (3x² − 5x) dx`,
 steps:[
 {w:'Primitiva.',m:`F(x) = 3·${F('x³','3')} − 5·${F('x²','2')} = x³ − ${F('5x²','2')}`,
  y:'3x² → x³ (3/3 = 1); −5x → −5x²/2.'},
 {w:'Teorema Fundamental.',m:`F(2) − F(−3)`,
  y:'Límite superior 2, límite inferior −3.'},
 {w:'Calculamos F(2).',m:`2³ − ${F('5·4','2')} = 8 − 10 = ${H('−2')}`,
  y:'2³ = 8; 2² = 4; 5·4/2 = 10.'},
 {w:'Calculamos F(−3).',m:`(−3)³ − ${F('5·9','2')} = −27 − ${F('45','2')} = ${F('−54 − 45','2')} = ${H(F('−99','2'))}`,
  y:'(−3)³ = −27 (exponente impar conserva el signo). (−3)² = 9 (exponente par lo vuelve positivo). −27 = −54/2.'},
 {w:'Restamos.',m:`−2 − (${F('−99','2')}) = −2 + ${F('99','2')} = ${F('−4 + 99','2')} = ${F('95','2')}`,
  y:'Restar un negativo es sumar. −2 = −4/2.'}
 ],r:`${F('95','2')}`,rs:'= 47,5'},

{l:'g',tag:'Definida (variable t)',p:`${I(-3,-1)} (2t + 5) dt`,
 steps:[
 {w:'Primitiva.',m:`F(t) = 2·${F('t²','2')} + 5t = t² + 5t`,
  y:'Es igual que con x, sólo cambia el nombre de la variable. 2t → t²; 5 → 5t.'},
 {w:'Teorema Fundamental.',m:`F(−1) − F(−3)`,
  y:'Arriba −1, abajo −3.'},
 {w:'Calculamos F(−1).',m:`(−1)² + 5(−1) = 1 − 5 = ${H('−4')}`,
  y:'(−1)² = 1 y 5·(−1) = −5.'},
 {w:'Calculamos F(−3).',m:`(−3)² + 5(−3) = 9 − 15 = ${H('−6')}`,
  y:'(−3)² = 9 y 5·(−3) = −15.'},
 {w:'Restamos.',m:`−4 − (−6) = −4 + 6 = 2`,
  y:'Restar un negativo es sumar.'}
 ],r:`2`},

{l:'h',tag:'Definida',p:`${I(-2,0)} (6x² − 8x) dx`,
 steps:[
 {w:'Primitiva.',m:`F(x) = 6·${F('x³','3')} − 8·${F('x²','2')} = 2x³ − 4x²`,
  y:'6/3 = 2 y 8/2 = 4.'},
 {w:'Teorema Fundamental.',m:`F(0) − F(−2)`,
  y:'Arriba 0, abajo −2.'},
 {w:'Calculamos F(0).',m:`2(0)³ − 4(0)² = ${H('0')}`,
  y:'Todo término multiplicado por 0 da 0.'},
 {w:'Calculamos F(−2).',m:`2(−2)³ − 4(−2)² = 2(−8) − 4(4) = −16 − 16 = ${H('−32')}`,
  y:'(−2)³ = −8 (impar, negativo); (−2)² = 4 (par, positivo).'},
 {w:'Restamos.',m:`0 − (−32) = 32`,
  y:'Restar un negativo es sumar.'}
 ],r:`32`}
]}
};

<script>
/* Modo Defensa: cómo explicarlo, aplicación en Ing. Mecánica, preguntas del profesor y errores comunes */
(function (G) {
G.DEF = {
  'limites-concepto': { pitch: 'Un límite describe a qué valor se acerca una función cuando la variable se acerca a un punto, aunque la función no esté definida ahí. Es la base de la derivada y de la integral.', mec: 'Se usa para analizar el comportamiento de sistemas en estado estable (t → ∞), por ejemplo la temperatura final de una pieza que se enfría o la velocidad terminal de un cuerpo que cae con resistencia del aire.', qa: [['¿El límite es lo mismo que evaluar la función?', 'No. Coinciden sólo si la función es continua en el punto. El límite estudia lo que pasa CERCA del punto, no en el punto.'], ['¿Cuándo un límite no existe?', 'Cuando los límites laterales son distintos, cuando la función oscila sin acercarse a un valor, o cuando crece sin cota (en ese caso decimos que tiende a ∞).'], ['¿Qué es una indeterminación?', 'Una forma como 0/0 o ∞/∞ que no permite saber el resultado directamente; hay que transformar la expresión (factorizar, racionalizar, L’Hôpital).']], err: ['Decir que 0/0 = 0 o que 0/0 = 1.', 'Cancelar términos que se suman (sólo se cancelan FACTORES).', 'Olvidar revisar los límites laterales cuando aparece k/0.'] },
  'limites-indeterminados': { pitch: 'Cuando al sustituir obtengo 0/0, significa que numerador y denominador comparten un factor que se anula. Lo encuentro factorizando o racionalizando, lo cancelo y vuelvo a sustituir.', mec: 'Aparece al calcular razones de cambio instantáneas, como la velocidad a partir de la posición, o en fórmulas de diseño que se vuelven 0/0 en casos límite.', qa: [['¿Por qué se puede cancelar (x − a)?', 'Porque en el límite x se acerca a a pero nunca es igual a a, así que (x − a) ≠ 0 y dividir entre él es válido.'], ['¿Siempre se puede usar L’Hôpital?', 'Sólo en formas 0/0 o ∞/∞ y si las derivadas existen. Si no, se usan otras técnicas.']], err: ['Aplicar la regla del cociente en vez de derivar arriba y abajo por separado (en L’Hôpital).', 'Racionalizar multiplicando sólo el numerador por el conjugado.'] },
  'derivada-definicion': { pitch: 'La derivada es la razón de cambio instantánea de una función: geométricamente, la pendiente de la recta tangente. Se define como el límite del cociente incremental cuando h tiende a 0.', mec: 'Velocidad = derivada de la posición; aceleración = derivada de la velocidad; potencia = derivada del trabajo respecto al tiempo; la pendiente de la curva esfuerzo-deformación es el módulo de elasticidad E.', qa: [['¿Qué significa físicamente la derivada?', 'Qué tan rápido cambia una magnitud respecto a otra en un instante.'], ['¿Toda función continua es derivable?', 'No. Ejemplo |x| en x = 0: es continua pero tiene un pico, la tangente no es única. Pero toda función derivable sí es continua.'], ['¿Para qué se usa la definición si existen reglas?', 'Las reglas se DEMUESTRAN con la definición; además sirve para funciones nuevas o para entender el concepto.']], err: ['Olvidar el paréntesis en f(x + h): (x + h)² ≠ x² + h².', 'Dividir entre h antes de cancelar los términos sin h.'] },
  'reglas-derivacion': { pitch: 'Las reglas de derivación (potencia, producto, cociente y cadena) permiten derivar rápidamente sin usar la definición cada vez.', mec: 'Derivar ecuaciones de movimiento, calcular velocidades en mecanismos biela-manivela, sensibilidad de un diseño respecto a una dimensión.', qa: [['¿La derivada de un producto es el producto de las derivadas?', 'No. (uv)′ = u′v + uv′.'], ['¿Por qué la derivada de una constante es 0?', 'Porque una constante no cambia: su razón de cambio es nula.']], err: ['(u/v)′ con el orden invertido en el numerador: es u′v − uv′, no uv′ − u′v.', 'Olvidar multiplicar por la derivada interna (regla de la cadena).'] },
  'regla-cadena': { pitch: 'La regla de la cadena deriva funciones compuestas: se deriva la función externa evaluada en la interna y se multiplica por la derivada de la interna.', mec: 'Si la temperatura depende de la posición y la posición del tiempo, dT/dt = dT/dx · dx/dt. Es clave en dinámica y en razones relacionadas.', qa: [['¿Cómo identifico que necesito la cadena?', 'Cuando dentro de una función hay algo más que x sola: sen(3x), (x² + 1)⁵, e^(2x).']], err: ['Derivar sólo la parte externa: (sen 3x)′ = cos 3x es incorrecto; es 3cos 3x.'] },
  'aplicaciones-derivada': { pitch: 'Los máximos y mínimos ocurren donde la derivada es cero o no existe; con la segunda derivada distingo si es máximo (f″ < 0) o mínimo (f″ > 0).', mec: 'Encontrar el momento flector máximo en una viga (donde el cortante es cero), la deflexión máxima, o el punto de operación de máxima potencia de un motor.', qa: [['¿f′(c) = 0 garantiza un extremo?', 'No. Puede ser punto de inflexión con tangente horizontal, como x³ en x = 0.'], ['¿Qué es un punto de inflexión?', 'Donde la curva cambia de concavidad; f″ cambia de signo.']], err: ['No revisar los extremos del intervalo en problemas con dominio cerrado.'] },
  'optimizacion': { pitch: 'Optimizar es encontrar el valor de la variable que hace máxima o mínima una cantidad, usando derivadas e igualando a cero.', mec: 'Minimizar el material de un tanque cilíndrico con volumen dado, maximizar la eficiencia de un intercambiador, diseñar la sección de una viga más ligera que resista una carga.', qa: [['¿Cómo sé que encontré un máximo y no un mínimo?', 'Con el criterio de la segunda derivada o evaluando valores alrededor.']], err: ['No usar la restricción para dejar la función en UNA variable.', 'Dar soluciones sin sentido físico (longitudes negativas).'] },
  'antiderivada': { pitch: 'Integrar es la operación inversa de derivar: buscar una función F cuya derivada sea f. Por eso se suma una constante C.', mec: 'De la aceleración se obtiene la velocidad y de ésta la posición; de la carga distribuida se obtiene el cortante y luego el momento flector.', qa: [['¿Por qué se pone + C?', 'Porque la derivada de cualquier constante es cero: hay infinitas primitivas que difieren en una constante.'], ['¿Cómo compruebo una integral?', 'Derivando el resultado: debo obtener la función original.']], err: ['Integrar 1/x con la regla de la potencia (da división entre cero). Es ln|x|.', 'Olvidar la C en las indefinidas.'] },
  'integral-definida': { pitch: 'La integral definida es el límite de una suma de Riemann y representa el área con signo bajo la curva. Se calcula con el Teorema Fundamental: F(b) − F(a).', mec: 'Trabajo de una fuerza variable W = ∫F dx, centro de masa, momento de inercia de secciones I = ∫y² dA, fuerza hidrostática sobre compuertas, energía en un resorte.', qa: [['¿La integral definida siempre es un área?', 'Es el área CON SIGNO: lo que está debajo del eje x resta. Para área geométrica se integra el valor absoluto.'], ['¿Qué dice el Teorema Fundamental del Cálculo?', 'Que derivación e integración son operaciones inversas, y que la integral definida se calcula con cualquier primitiva: F(b) − F(a).']], err: ['Restar al revés: F(a) − F(b).', 'Equivocar signos al evaluar en límites negativos: (−3)² = 9 pero (−3)³ = −27.'] },
  'sustitucion': { pitch: 'La sustitución es la regla de la cadena al revés: elijo u como la función interna cuya derivada aparece en la integral, cambio todo a u, integro y regreso a x.', mec: 'Integrales de energía, de enfriamiento exponencial y de formas como ∫x·e^(−x²) que aparecen en transferencia de calor y probabilidad.', qa: [['¿Cómo elijo u?', 'La parte “de adentro” de una función compuesta, o la que al derivarse aparece multiplicando.']], err: ['Dejar x mezcladas con u.', 'En definidas, olvidar cambiar los límites o regresar a x antes de evaluar.'] },
  'partes': { pitch: 'Integración por partes viene de la regla del producto: ∫u dv = uv − ∫v du. Se elige u con la regla LIATE.', mec: 'Aparece en transformadas de Laplace (vibraciones y control) y en integrales de x·eˣ, x·sen x que modelan respuestas de sistemas.', qa: [['¿De dónde sale la fórmula?', 'Integrando la regla del producto (uv)′ = u′v + uv′.'], ['¿Qué pasa si elijo mal u?', 'La nueva integral se vuelve más difícil; hay que cambiar la elección.']], err: ['Olvidar el signo menos antes de la segunda integral.'] },
  'mru-mrua': { pitch: 'En el MRU la velocidad es constante; en el MRUA la aceleración es constante. Las ecuaciones salen de integrar a(t) dos veces.', mec: 'Frenado de vehículos, arranque de bandas transportadoras, cálculo de tiempos en ciclos de máquinas.', qa: [['¿De dónde sale x = x₀ + v₀t + ½at²?', 'Integrando v(t) = v₀ + at respecto al tiempo.'], ['¿Qué signo tiene g?', 'Depende del sistema de referencia: si el eje y apunta hacia arriba, a = −g.']], err: ['Mezclar unidades (km/h con m/s).', 'Cambiar el sistema de referencia a mitad del problema.'] },
  'newton-leyes': { pitch: 'Las leyes de Newton relacionan las fuerzas con el movimiento: inercia, ΣF = ma y acción-reacción. Siempre empiezo con un diagrama de cuerpo libre.', mec: 'Base de todo el diseño de máquinas: fuerzas en engranajes, tensiones en cables, frenos, embragues y suspensiones.', qa: [['¿La normal siempre es igual al peso?', 'No. Sólo en una superficie horizontal sin otras fuerzas verticales. En un plano inclinado N = mg cos θ.'], ['¿Acción y reacción se anulan?', 'No, porque actúan sobre cuerpos DISTINTOS.']], err: ['Poner en el diagrama fuerzas que el cuerpo ejerce sobre otros.', 'Usar μs cuando el cuerpo ya se mueve (es μk).'] },
  'trabajo-energia': { pitch: 'El trabajo es la transferencia de energía por una fuerza a lo largo de un desplazamiento. Sin fricción, la energía mecánica se conserva.', mec: 'Dimensionar motores (potencia), volantes de inercia, resortes, sistemas de elevación y frenos (energía disipada en calor).', qa: [['¿Una fuerza perpendicular al movimiento hace trabajo?', 'No: W = Fd cos 90° = 0 (por ejemplo, la normal o la fuerza centrípeta).'], ['¿Qué pasa con la energía cuando hay fricción?', 'Se transforma en calor; ya no se conserva la energía mecánica, pero sí la total.']], err: ['Olvidar el cos θ en el trabajo.', 'Confundir energía (J) con potencia (W).'] },

/* ---------- código línea por línea ---------- */
const KW = {
  Python: 'def return if elif else for while in import from as and or not True False None lambda break continue raise class try except with pass yield global',
  C: 'int double float char void return if else for while do switch case break continue include define const unsigned long short struct sizeof',
  'C++': 'int double float char void return if else for while do break continue include const using namespace std class public private auto bool true false',
  MATLAB: 'function end if else elseif for while break return global',
  Arduino: 'const int float void return if else for while do break unsigned long bool true false',
  'Pseudocódigo': 'Inicio Fin Leer Escribir Si Sino FinSi entonces Mientras FinMientras Para FinPara'
};
function hiLine(line, lang) {
  const cm = lang === 'Python' ? '#.*$' : lang === 'MATLAB' ? '%.*$' : lang === 'Pseudocódigo' ? '(?!x)x' : '\\/\\/.*$';
  const re = new RegExp(`(${cm})|("(?:[^"\\\\]|\\\\.)*"|'(?:[^'\\\\]|\\\\.)*')|(\\b\\d+\\.?\\d*(?:e-?\\d+)?\\b)|(#\\w+|\\b[A-Za-zÁ-ú_]\\w*\\b)(\\s*\\()?`, 'g');
  const kws = new Set((KW[lang] || '').split(' '));
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    if (m[1]) out += `<span class="cm">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="st">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="nu">${m[3]}</span>`;
    else if (m[4]) { const wd = m[4]; out += kws.has(wd) || wd.startsWith('#') ? `<span class="kw">${esc(wd)}</span>` : m[5] ? `<span class="fn2">${esc(wd)}</span>` : esc(wd); if (m[5]) out += esc(m[5]); }
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function renderCode(ph, lang, src, expl) {
  const lines = src.split('\n'); const ex = (expl || []).slice().sort((a, b) => a[0] - b[0]); let k = -1;

    <pre>${lines.map((ln, i) => `<span class="ln" data-n="${i + 1}"><span class="no">${i + 1}</span>${hiLine(ln, lang) || ' '}</span>`).join('')}</pre>
    <div class="cexp">Toca <b>“Siguiente línea”</b> para ver qué hace cada instrucción, o toca cualquier línea del código.</div>
    <div class="cbtn"><button data-c="p">◂ Anterior</button><button class="pp" data-c="n">Siguiente línea ▸</button></div></div>`;
  const show = () => {

  $$('.ln', ph).forEach(el => el.onclick = () => { const n = +el.dataset.n; const j = ex.findIndex(e => e[0] === n); if (j >= 0) { k = j; show(); } else { $$('.ln', ph).forEach(e => e.classList.remove('on')); el.classList.add('on'); $('.cexp', ph).innerHTML = `<b>Línea ${n}:</b> ${lines[n - 1].trim() ? 'continuación de la instrucción anterior o línea de estructura.' : 'línea en blanco (separa partes del programa para que sea más legible).'}`; } });
}

  const stepsEl = $('.steps', out), fin = $('.fin', out);
  function add(k, anim) {
    const s = r.steps[k];

  }

  }
  function upd() {
    $('.prog i', out).style.width = (tot ? shown / tot * 100 : 100) + '%';

  }

  $('[data-c="a"]', out).onclick = () => { while (shown < tot) add(shown++, false); if (!fin.innerHTML) finish(true); upd(); };
  $('[data-c="r"]', out).onclick = () => { shown = 0; stepsEl.innerHTML = ''; fin.innerHTML = ''; upd(); out.scrollIntoView({ behavior: 'smooth' }); };
  if (tot === 0) finish(true);

}

function beamTool(b) {

      S.push({ d: 0, w: 'ΣM<sub>A</sub> = 0', m: `R<sub>B</sub>·${f(L)} = ${[...P.map(q => `${f(q.p)}(${f(q.x)})`), w ? `${f(W)}(${f(L / 2)})` : null].filter(Boolean).join(' + ')} = ${f(mB)} &nbsp;⇒&nbsp; R<sub>B</sub> = ${f(RB)} kN`, y: 'Tomamos momentos respecto a A: así R_A no aparece (pasa por A). Cada carga por su distancia a A.' });
      S.push({ d: 0, w: 'ΣF<sub>y</sub> = 0', m: `R<sub>A</sub> + R<sub>B</sub> = ${f(sumP + W)} &nbsp;⇒&nbsp; R<sub>A</sub> = ${f(RA)} kN`, y: 'La suma de reacciones debe igualar la carga total.' });
      const V = (x) => RA - w * x - P.reduce((s, q) => s + (x > q.x ? q.p : 0), 0);

      const xs = []; for (let i = 0; i <= 400; i++) xs.push(L * i / 400); P.forEach(q => { xs.push(q.x - 1e-9, q.x + 1e-9); }); xs.sort((a, c) => a - c);

      S.push({ d: 0, w: 'Momento flector M(x)', m: `M(x) = R<sub>A</sub>·x − w·x²/2 − Σ P<sub>i</sub>(x − x<sub>i</sub>)`, y: 'dM/dx = V: el momento es máximo donde el cortante cruza por cero.' });

/* ---- lector con IA (Claude). La clave es del usuario y se guarda sólo en su teléfono ---- */
const OCR_SCHEMA = { type: 'object', additionalProperties: false, required: ['ejercicios'], properties: { ejercicios: { type: 'array', items: { type: 'object', additionalProperties: false,
  required: ['tipo', 'expresion', 'variable', 'limite_inferior', 'limite_superior', 'tiende_a', 'orden', 'enunciado', 'confianza'],
  properties: { tipo: { type: 'string', enum: ['integral', 'derivada', 'limite', 'ecuacion', 'sistema', 'matriz', 'taylor', 'operacion'] }, expresion: { type: 'string' }, variable: { type: 'string' },
    limite_inferior: { type: 'string' }, limite_superior: { type: 'string' }, tiende_a: { type: 'string' }, orden: { type: 'integer' }, enunciado: { type: 'string' }, confianza: { type: 'string', enum: ['alta', 'media', 'baja'] } } } } } };
const OCR_PROMPT = `Lee la imagen: es un ejercicio de matemática (pizarra, cuaderno, libro o pantalla), escrito a mano o impreso. Transcribe el ENUNCIADO de cada ejercicio que aparezca (si hay una solución ya escrita debajo, ignórala y transcribe sólo el enunciado original). No resuelvas nada.

Para cada ejercicio devuelve:
- tipo: integral, derivada, limite, ecuacion, sistema, matriz, taylor u operacion (cuenta numérica sin variables).
- expresion, escrita en esta sintaxis de calculadora:
  potencias x^2, (x+1)^3; multiplicación con * o implícita (3x, 2(x+1)); fracciones con paréntesis completos: (x^2-1)/(x+3);
  funciones sin(x) cos(x) tan(x) asin(x) atan(x) ln(x) log(x) sqrt(x) cbrt(x) abs(x) e^(2x); constantes pi, e; infinito inf.
  * integral: sólo el integrando (sin ∫ ni dx). * derivada: sólo la función. * limite: sólo la función.
  * ecuacion: con un signo =. * sistema: ecuaciones separadas por ;. * matriz: números por espacios y filas separadas por ;.
- variable: la variable (normalmente x).
- limite_inferior y limite_superior: los límites de una integral definida (cadena vacía si no hay). Usa inf o -inf si son infinitos.
- tiende_a: a qué tiende la variable en un límite (cadena vacía si no es límite); usa inf o -inf para infinito.
- orden: orden de la derivada (1 si no aplica).
- enunciado: el ejercicio tal como se ve, con símbolos legibles (∫, lím, √, ², →).
- confianza: alta, media o baja según qué tan claro se lee.
Cuida los signos negativos, los exponentes pequeños y no confundas x con ×, ni 2 con z, ni 5 con s.`;
async function aiRead(b64) {
  if (!navigator.onLine) throw new Error('Sin conexión a internet. La lectura con IA necesita internet; prueba “En el teléfono” o escribe el ejercicio.');
  const model = AI.model(), opus = /opus/.test(model);
  const body = { model, max_tokens: 16000, output_config: { effort: 'medium', format: { type: 'json_schema', schema: OCR_SCHEMA } },
    messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: OCR_PROMPT }] }] };
  const headers = { 'content-type': 'application/json', 'x-api-key': AI.key(), 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true' };
  if (opus) { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; } // si el modelo declina, el servidor reintenta con otro
  let res;
  try { res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('No se pudo conectar con el servicio de IA. Revisa tu internet.'); }
  let j = null; try { j = await res.json(); } catch (e) { }
  if (!res.ok) {
    const m = j && j.error && j.error.message ? j.error.message : '';
    if (res.status === 401) throw new Error('La clave de API no es válida. Revísala en Ajustes.');
    if (res.status === 403) throw new Error('Tu clave no tiene permiso para este modelo. ' + m);
    if (res.status === 429) throw new Error('Demasiadas solicitudes o sin saldo en tu cuenta de Anthropic. Espera un momento. ' + m);
    if (res.status === 529 || res.status >= 500) throw new Error('El servicio de IA está ocupado. Intenta de nuevo en un minuto.');
    throw new Error('Error de la IA (' + res.status + '). ' + m);
  }
  if (j.stop_reason === 'refusal') throw new Error('La IA no pudo procesar esta imagen. Prueba con otra foto o escribe el ejercicio.');
  if (j.stop_reason === 'max_tokens') throw new Error('La respuesta de la IA quedó incompleta. Marca un solo ejercicio e intenta de nuevo.');
  const txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  let data; try { data = JSON.parse(txt); } catch (e) { throw new Error('No entendí la respuesta de la IA. Intenta de nuevo.'); }
  const map = { integral: 'int', derivada: 'der', limite: 'lim', ecuacion: 'eq', sistema: 'sys', matriz: 'mat', taylor: 'taylor', operacion: 'calc' };
  return (data.ejercicios || []).filter(x => x.expresion).map(x => ({ tipo: map[x.tipo] || 'calc', expresion: x.expresion, v: x.variable || 'x', a: x.tipo === 'limite' ? x.tiende_a : x.limite_inferior, b: x.limite_superior, o: String(x.orden || 1), enunciado: x.enunciado, confianza: x.confianza }));
}

let tessP = null;

  tessP = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = () => { tessP = null; ko(new Error('No se pudo descargar el lector. La primera vez necesita internet.')); }; document.head.appendChild(s); });

function binarize(c) { // escala de grises + umbral adaptativo: mejora fotos de pizarra o cuaderno
  const x = c.getContext('2d'), W = c.width, Hh = c.height, d = x.getImageData(0, 0, W, Hh), p = d.data, g = new Float64Array(W * Hh);

    const x0 = Math.max(0, xx - R), x1 = Math.min(W, xx + R + 1), y0 = Math.max(0, y - R), y1 = Math.min(Hh, y + R + 1);
    const m = (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
    let ink = dark ? g[y * W + xx] > m + 12 : g[y * W + xx] < m - 12; const v = ink ? 0 : 255, k = (y * W + xx) * 4; p[k] = p[k + 1] = p[k + 2] = v;

}

function guessFromText(t) { // convierte texto leído en un ejercicio probable (heurística)
  const lines = t.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return [];
  const numLines = lines.filter(l => /^[-−]?\d+(\.\d+)?$/.test(l));
  let s = lines.filter(l => !/^[-−]?\d+(\.\d+)?$/.test(l)).join(' ') || lines.join(' ');
  s = s.replace(/[—–−]/g, '-').replace(/÷/g, '/').replace(/\s+/g, ' ').trim();
  const it = { tipo: 'calc', expresion: s, v: 'x', a: '', b: '', o: '1', enunciado: lines.join('  '), confianza: 'baja' };
  let m;
  if (/\blim/i.test(s)) {
    it.tipo = 'lim'; m = /([a-z])\s*(?:->|→|-+>)\s*([-−]?\w+)/i.exec(s); if (m) { it.v = m[1]; it.a = m[2].replace(/oo|∞/, 'inf'); }
    s = s.replace(/lim\S*\s*/i, '').replace(/[a-z]\s*(?:->|→|-+>)\s*[-−]?\w+/i, '');
  } else if (/^\s*[∫fJS/]\s*\(|∫|\bd[xyt]\b\s*$/.test(s)) {
    it.tipo = 'int'; s = s.replace(/^\s*[∫fJS/]\s*(?=\()/, '').replace(/∫/g, '').replace(/\s*d[xyt]\s*$/, '');
    if (numLines.length >= 2) { it.b = numLines[0]; it.a = numLines[numLines.length - 1]; }
  } else if (/d\s*\/\s*d[xyt]|derivad/i.test(s)) { it.tipo = 'der'; s = s.replace(/.*?d\s*\/\s*d[xyt]\s*/i, '').replace(/derivada de/i, ''); }
  else if (/=/.test(s) && /[a-z]/i.test(s)) it.tipo = (s.match(/=/g) || []).length > 1 ? 'sys' : 'eq';
  s = s.replace(/([a-z)])(\d)(?![\d.])/gi, '$1^$2'); // x2 → x^2 (los exponentes suelen leerse pegados)
  it.expresion = s.trim();
  return [it];
}

function lc1(s) { return /^(El|La|Los|Las|Un|Una|Unos|Unas|En|Se|Es|Son)\b/.test(s) ? s[0].toLowerCase() + s.slice(1) : s; }
function structure(text) {
  const STOP = /^(Referencias|Véase también|Enlaces externos|Bibliografía|Notas|Fuentes|Lecturas adicionales)\s*$/i;
  const lines = text.split('\n').map(s => s.trim());
  const paras = [];
  for (const l of lines) { if (STOP.test(l)) break; if (l.length > 80 && !/^[=]/.test(l)) paras.push(l); }
  const intro = paras[0] || '';
  const dev = []; let len = 0;
  for (const p of paras.slice(1)) { if (len > 1500) break; dev.push(p); len += p.length; }
  const sents = intro.match(/[^.!?]+[.!?]+(\s|$)/g) || [intro];
  const pitch = sents.slice(0, 2).join(' ').trim();
  const first = sents[0].replace(/\s*\([^)]*\)/g, '').trim();
  const lastDev = dev.length ? (dev[dev.length - 1].match(/[^.!?]+[.!?]+(\s|$)/g) || [])[0] : '';
  const concl = `En resumen, ${lc1(first)}${lastDev && sents.length > 1 ? ' ' + (sents[1] || '').trim() : ''}`;
  return { intro, dev, concl, pitch };
}

let IDX = null;
function buildIndex() {
  IDX = LIB.lessons.map(l => ({ l, t: norm(l.t), k: norm(l.kw || ''), b: norm(strip(l.b.map(b => typeof b[1] === 'string' ? b[1] : b[0] === 'ex' ? b[1].q + ' ' + b[1].s.map(s => s.join(' ')).join(' ') : '').join(' '))), a: norm((LIB.areas.find(a => a.id === l.area) || {}).name || '') }));
}
function localSearch(q) {
  if (!IDX) buildIndex();
  const toks = norm(q).split(/[^a-z0-9ñ]+/).filter(t => t.length > 1 && !['de', 'la', 'el', 'que', 'es', 'un', 'una', 'los', 'las', 'en', 'y', 'como', 'del', 'por', 'para', 'con'].includes(t));
  if (!toks.length) return [];
  return IDX.map(e => {
    let s = 0;
    toks.forEach(t => { if (e.t.includes(t)) s += 10; if (e.k.includes(t)) s += 6; if (e.a.includes(t)) s += 3; if (e.b.includes(t)) s += 1; });
    if (toks.every(t => e.t.includes(t) || e.k.includes(t))) s += 8;
    return { l: e.l, s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 12).map(x => x.l);
}
function detectSolve(q) {
  const s = q.trim(); const out = [];
  const m1 = s.match(/^(?:la\s+)?deriva(?:da|r)?\s*(?:de)?\s+(.+)$/i); if (m1) return [['der', m1[1]]];
  const m2 = s.match(/^(?:la\s+)?integra(?:l|r)?\s*(?:de)?\s+(.+?)(?:\s+de\s+(\S+)\s+a\s+(\S+))?$/i); if (m2) return [['int', m2[1], m2[2], m2[3]]];
  const m3 = s.match(/^l[ií]m(?:ite)?\s*(?:de)?\s+(.+?)\s+(?:cuando\s+)?x\s*(?:->|→|tiende a)\s*(\S+)$/i); if (m3) return [['lim', m3[1], m3[2]]];
  if (/=/.test(s)) { try { s.split('=').forEach(p => M.parse(p)); return [['eq', s]]; } catch (e) { return []; } }
  try { const u = M.parse(s); if (M.vars(u).has('x') && /[\d^()*/+\-]|sin|cos|tan|ln|sqrt|e\^/.test(s)) { out.push(['der', s], ['int', s], ['graph', s]); } } catch (e) { }
  return out;
}
function openSearch(initial) {
  if ($('#search')) return;
  history.pushState({ s: 1 }, '');
  const el = document.createElement('div'); el.id = 'search';
  el.innerHTML = `<div class="s-top"><button class="ib back" id="sx" aria-label="Cerrar">${ic('back')}</button><div class="s-in">${ic('search')}<input id="sq" placeholder="Ej: qué es un software, Bernoulli, integral de x^2…" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div></div><div class="s-body" id="sb"></div>`;
  document.body.appendChild(el);
  const inp = $('#sq', el); inp.value = initial || ''; setTimeout(() => inp.focus(), 80);
  $('#sx', el).onclick = () => history.back();
  let wt;
  const run = () => {
    const q = inp.value.trim(); const sb = $('#sb', el);
    if (!q) { sb.innerHTML = `<div class="s-sec">Sugerencias</div><div class="s-sug">${['¿Qué es un software?', 'Regla de la cadena', 'Bernoulli', 'Esfuerzo y deformación', 'Newton-Raphson', 'Python', 'Integración por partes', 'Termodinámica', 'derivada de x^2 sin(x)', 'Engranaje', 'Torque', 'Soldadura'].map(s => `<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`; $$('[data-q]', sb).forEach(b => b.onclick = () => { inp.value = b.dataset.q; run(); }); return; }
    const sv = detectSolve(q); const res = localSearch(q);
    const names = { der: 'Derivar paso a paso', int: 'Integrar paso a paso', lim: 'Calcular el límite', eq: 'Resolver la ecuación', graph: 'Graficar' };
    let h = '';
    if (sv.length) h += `<div class="s-sec">${ic('pen', 14)} Resolver</div>` + sv.map((x, i) => { let pv = ''; try { pv = x[0] === 'eq' ? x[1].split('=').map(p => M.H(M.parse(p))).join(' = ') : M.H(M.parse(x[1])); } catch (e) { pv = esc(x[1]); } return `<button class="solve-card" data-sv="${i}">${ic(x[0] === 'graph' ? 'chart' : 'pen')}<span><b>${names[x[0]]}</b><small>${pv}</small></span></button>`; }).join('');
    h += `<div class="s-sec">${ic('book', 14)} En la app (${res.length})</div>` + (res.length ? res.map(rowLesson).join('') : `<div class="s-empty" style="padding:8px">No está en la biblioteca local.</div>`);
    h += `<div class="s-sec">${ic('globe', 14)} En internet</div><div id="swr"><div class="s-empty" style="padding:10px"><span class="spin"></span> Buscando en Wikipedia…</div></div>`;
    sb.innerHTML = h;
    $$('[data-sv]', sb).forEach(b => b.onclick = () => { const x = sv[+b.dataset.sv]; closeSearch(false, () => { if (x[0] === 'graph') { store.set('graphs', [x[1], '', '']); goTab('lab', { tool: 'graph' }); } else goTab('solve', { mode: x[0], pre: { e: x[1], a: x[2], b: x[3] } }); }); });
    $$('[data-l]', sb).forEach(b => b.onclick = () => closeSearch(false, () => push('lesson', { id: b.dataset.l })));
    clearTimeout(wt);
    wt = setTimeout(async () => {
      const box = $('#swr', el); if (!box) return;
      try {
        const rs = await wikiSearch(q.replace(/^¿?\s*qu[eé]\s+(es|son)\s+(un|una|el|la|los|las)?\s*/i, '').replace(/\?$/, ''));
        if (inp.value.trim() !== q) return;
        box.innerHTML = rs.length ? rs.map(r => `<button class="rowcard" data-wt="${esc(r.title)}"><span class="rc-i" style="background:${grad(['#06b6d4', '#0e7490'])}">${ic('globe', 18)}</span><span class="rc-t"><b>${esc(r.title)}</b><small>${strip(r.snippet)}</small></span><span class="chev">${ic('chev')}</span></button>`).join('') : '<div class="s-empty">Sin resultados en internet.</div>';
        $$('[data-wt]', box).forEach(b => b.onclick = () => closeSearch(false, () => push('wiki', { title: b.dataset.wt })));
      } catch (e) { box.innerHTML = `<div class="s-empty" style="padding:10px">${navigator.onLine === false ? '📡 Sin conexión: la búsqueda en internet no está disponible.' : 'No se pudo consultar internet ahora.'}</div>`; }
    }, 450);
  };
  inp.addEventListener('input', () => { clearTimeout(el._t); el._t = setTimeout(run, 220); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); run(); } });
  run();
}
function closeSearch(fromPop, then) { const el = $('#search'); if (!el) return; el.remove(); if (fromPop === true) return; if (then) pendingNav = then; history.back(); }

function splash(done) {
  const name = (store.get('name', '') || 'Angel');
  const s = document.createElement('div'); s.id = 'splash';
  s.innerHTML = `<div class="sp-in"><div class="logo"><span>∫</span></div><h1 class="sp-title">INGENIUM</h1><div class="sp-sub">Matemática · Física · Programación · Ingeniería</div><div class="sp-bar"><i></i></div><div class="sp-hello">¡Bienvenido, ${esc(name)}!</div></div>`;
  document.body.appendChild(s);
  setTimeout(() => { s.classList.add('out'); done(); setTimeout(() => s.remove(), 700); }, name ? 1900 : 1600);
}
function onboarding(done) {
  const o = document.createElement('div'); o.id = 'onb';
  const SL = [
    ['∫', 'Resuelve cualquier ejercicio', 'Escribe tu derivada, integral, límite, ecuación, sistema o matriz y la app lo resuelve paso a paso, explicando de dónde sale cada cosa.', ['#4f46e5', '#7c3aed']],
    ['📚', 'Tu biblioteca de ingeniería', 'Cálculo, cálculo numérico, física, estática, materiales, termodinámica, química y programación, con figuras, fórmulas y ejemplos resueltos.', ['#0ea5e9', '#2563eb']],
    ['🛡️', 'Modo Defensa', 'Para cuando te toque exponer: cómo explicarlo en 30 segundos, dónde se usa en ingeniería mecánica, preguntas del profesor y errores comunes.', ['#10b981', '#047857']],
    ['🔍', 'Busca lo que sea', 'La lupa busca en la app y, con internet, en Wikipedia: te arma un resumen con Introducción, Desarrollo y Conclusión.', ['#f59e0b', '#d97706']]
  ];
  o.innerHTML = `<div class="onb-slides" id="os">${SL.map(([e, t, p, g]) => `<div class="onb-s"><div class="onb-art" style="background:${grad(g)}">${e}</div><h2>${t}</h2><p>${p}</p></div>`).join('')}
    <div class="onb-s"><div class="onb-art" style="background:${grad(['#312e81', '#7c3aed'])};font-size:60px">👋</div><h2>¿Cómo te llamas?</h2><p>Así te saludo cada vez que entres.</p><input id="on" value="Angel" placeholder="Tu nombre" style="max-width:320px;margin:20px auto 0;text-align:center;font-size:18px" autocomplete="given-name"></div></div>
    <div class="onb-foot"><div class="dots">${[...SL, 0].map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><button class="btn btn-g" id="osk">Saltar</button><button class="btn btn-p" id="onx">Siguiente</button></div>`;
  document.body.appendChild(o);
  let i = 0; const N = SL.length + 1;
  const go = () => { $('#os', o).style.transform = `translateX(-${i * 100}%)`; $$('.dots i', o).forEach((d, k) => d.classList.toggle('on', k === i)); $('#onx', o).textContent = i === N - 1 ? 'Comenzar' : 'Siguiente'; $('#osk', o).style.visibility = i === N - 1 ? 'hidden' : 'visible'; if (i === N - 1) setTimeout(() => $('#on', o).focus(), 450); };
  const end = () => { store.set('name', ($('#on', o).value || '').trim() || 'Angel'); store.set('onb', true); o.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(1.04)' }], { duration: 400 }).onfinish = () => { o.remove(); done(); }; };
  $('#onx', o).onclick = () => { if (i < N - 1) { i++; go(); } else end(); };
  $('#osk', o).onclick = () => { i = N - 1; go(); };
  $('#on', o).onkeydown = e => { if (e.key === 'Enter') end(); };
  let sx = null; o.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  o.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (dx < -50 && i < N - 1) { i++; go(); } if (dx > 50 && i > 0) { i--; go(); } sx = null; });
}
function start() {
  buildShell();
  // engranaje de ajustes en el inicio
  const tb = $('#tb'); const g = document.createElement('button'); g.className = 'ib'; g.id = 'tbGear'; g.innerHTML = ic('gear'); g.setAttribute('aria-label', 'Ajustes'); tb.appendChild(g);
  g.onclick = () => push('settings');
  goTab('home');
  window.addEventListener('resize', movePill);
}
const boot = () => {
  if (!store.get('onb', false)) { splash(() => onboarding(() => legalGate(start))); }
  else splash(() => legalGate(start));
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
window.INGENIUM = { goTab, push, openSearch };
})();
