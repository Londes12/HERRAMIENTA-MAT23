<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Asistente de ingeniería: resolvedor paso a paso, cálculo numérico, física, química y programación.">
<title>INGENIUM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='Georgia' font-style='italic'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<style>
/* ============ INGENIUM · estilos ============ */
:root {
  --bg: #f3f5fb; --bg2: #e9edf7; --card: #ffffff; --card2: #f7f8fc; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --pri: #4f46e5; --pri2: #7c3aed; --acc: #0891b2; --ok: #059669; --okbg: #ecfdf5; --warn: #b45309; --why: #fffbeb; --whyline: #f59e0b; --err: #dc2626;
  --plot-bg: #ffffff; --plot-grid: #eef2f7; --plot-axis: #94a3b8;
  --c1: #2563eb; --c2: #e11d48; --c3: #059669;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --shadow2: 0 12px 40px rgba(79,70,229,.25);
  --r: 18px; --nav-h: 68px;
  --hero: linear-gradient(135deg, #312e81 0%, #4f46e5 45%, #7c3aed 100%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070b16; --bg2: #0c1324; --card: #111a2e; --card2: #16213a; --ink: #e8edf7; --muted: #8a97b1; --line: #1f2b45;
  --pri: #818cf8; --pri2: #a78bfa; --acc: #22d3ee; --ok: #34d399; --okbg: #062a1f; --warn: #fbbf24; --why: #1d1a10; --whyline: #d4a017; --err: #f87171;
  --plot-bg: #0d1528; --plot-grid: #18233b; --plot-axis: #4b5a78;
  --c1: #60a5fa; --c2: #fb7185; --c3: #34d399;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --hero: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #6d28d9 100%);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #070b16; --bg2: #0c1324; --card: #111a2e; --card2: #16213a; --ink: #e8edf7; --muted: #8a97b1; --line: #1f2b45;
  --pri: #818cf8; --pri2: #a78bfa; --acc: #22d3ee; --ok: #34d399; --okbg: #062a1f; --warn: #fbbf24; --why: #1d1a10; --whyline: #d4a017; --err: #f87171;
  --plot-bg: #0d1528; --plot-grid: #18233b; --plot-axis: #4b5a78;
  --c1: #60a5fa; --c2: #fb7185; --c3: #34d399;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --hero: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #6d28d9 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input, textarea, select { background: var(--card2); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, textarea:focus, select:focus { border-color: var(--pri); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pri) 18%, transparent); }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; background: var(--card2); padding: 1px 5px; border-radius: 6px; }

/* ---------- Splash ---------- */
#splash { position: fixed; inset: 0; z-index: 100; background: var(--hero); display: grid; place-items: center; color: #fff; transition: opacity .6s ease, transform .6s ease; }
#splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
.sp-in { text-align: center; padding: 24px; }
.logo { width: 110px; height: 110px; margin: 0 auto 22px; border-radius: 30px; background: rgba(255,255,255,.12); backdrop-filter: blur(6px); display: grid; place-items: center; box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.25); animation: pop .9s cubic-bezier(.2,1.4,.4,1) both; position: relative; overflow: hidden; }
.logo::after { content: ""; position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent, rgba(255,255,255,.35), transparent 30%); animation: spin 2.4s linear infinite; }
.logo span { font-size: 58px; font-weight: 300; font-family: Georgia, "Times New Roman", serif; font-style: italic; position: relative; z-index: 1; animation: glow 2s ease-in-out infinite alternate; }
.sp-title { font-size: 34px; font-weight: 800; letter-spacing: .14em; margin: 0; animation: up .8s .25s both; }
.sp-sub { opacity: .85; margin-top: 6px; font-size: 15px; animation: up .8s .45s both; }
.sp-bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); margin: 28px auto 0; overflow: hidden; animation: up .8s .6s both; }
.sp-bar i { display: block; height: 100%; width: 40%; background: #fff; border-radius: 4px; animation: load 1.2s ease-in-out infinite; }
.sp-hello { margin-top: 18px; font-size: 18px; font-weight: 600; animation: up .8s .7s both; min-height: 27px; }
@keyframes pop { from { transform: scale(.4) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { from { text-shadow: 0 0 10px rgba(255,255,255,.3); } to { text-shadow: 0 0 26px rgba(255,255,255,.9); } }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

/* ---------- Onboarding ---------- */
#onb { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; }
.onb-slides { flex: 1; display: flex; transition: transform .5s cubic-bezier(.65,0,.35,1); }
.onb-s { min-width: 100%; padding: 40px 28px 20px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.onb-art { width: 210px; height: 210px; margin: 0 auto 28px; border-radius: 50%; display: grid; place-items: center; font-size: 76px; color: #fff; box-shadow: var(--shadow2); font-family: Georgia, serif; font-style: italic; position: relative; }
.onb-art::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--pri) 40%, transparent); animation: spin 18s linear infinite; }
.onb-s h2 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.01em; }
.onb-s p { color: var(--muted); margin: 0 auto; max-width: 420px; }
.onb-foot { padding: 18px 24px calc(22px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 7px; flex: 1; }
.dots i { width: 8px; height: 8px; border-radius: 8px; background: var(--line); transition: all .35s; }
.dots i.on { width: 26px; background: var(--pri); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 22px; border-radius: 14px; font-weight: 700; font-size: 15.5px; transition: transform .15s, box-shadow .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn-p { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--pri) 40%, transparent); }
.btn-s { background: var(--card2); color: var(--ink); border: 1.5px solid var(--line); }
.btn-g { color: var(--muted); }
.btn:disabled { opacity: .45; }
.btn-block { width: 100%; }

/* ---------- Estructura ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 16px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.sc { border-bottom-color: var(--line); }
.tb-title { flex: 1; min-width: 0; font-weight: 800; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.ib { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--ink); background: var(--card); border: 1px solid var(--line); transition: transform .15s, background .2s; }
.ib:active { transform: scale(.92); }
.ib.back { background: transparent; border-color: transparent; }
#views { flex: 1; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
.view.enter { animation: vin .42s cubic-bezier(.2,.8,.2,1) both; }
.view.enter-back { animation: vinb .42s cubic-bezier(.2,.8,.2,1) both; }
.view.enter-tab { animation: vfade .35s ease both; }
@keyframes vin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes vinb { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@keyframes vfade { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: none; } }
.wrap { max-width: 760px; margin: 0 auto; }
.stag > * { animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
.stag > *:nth-child(1) { animation-delay: .02s } .stag > *:nth-child(2) { animation-delay: .06s } .stag > *:nth-child(3) { animation-delay: .1s } .stag > *:nth-child(4) { animation-delay: .14s } .stag > *:nth-child(5) { animation-delay: .18s } .stag > *:nth-child(6) { animation-delay: .22s } .stag > *:nth-child(7) { animation-delay: .26s } .stag > *:nth-child(8) { animation-delay: .3s } .stag > *:nth-child(n+9) { animation-delay: .34s }

/* ---------- Barra inferior ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 10px env(safe-area-inset-bottom); background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: saturate(1.6) blur(16px); -webkit-backdrop-filter: saturate(1.6) blur(16px); border-top: 1px solid var(--line); }
.nav-in { max-width: 640px; margin: 0 auto; height: var(--nav-h); display: flex; position: relative; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .02em; position: relative; z-index: 1; transition: color .25s; }
.nav button svg { transition: transform .3s cubic-bezier(.2,1.5,.4,1); }
.nav button.on { color: var(--pri); }
.nav button.on svg { transform: translateY(-2px) scale(1.1); }
.nav-pill { position: absolute; top: 8px; height: 52px; border-radius: 16px; background: color-mix(in srgb, var(--pri) 13%, transparent); transition: left .38s cubic-bezier(.3,1.3,.5,1), width .38s; }
.nav .fab { flex: none; width: 64px; }
.nav .fab span.fb { width: 54px; height: 54px; border-radius: 18px; margin-top: -26px; display: grid; place-items: center; background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; box-shadow: 0 10px 26px color-mix(in srgb, var(--pri) 50%, transparent); transition: transform .2s; }
.nav .fab:active span.fb { transform: scale(.92); }

/* ---------- Inicio ---------- */
.hero { margin: 6px 0 18px; border-radius: 26px; padding: 22px 20px; background: var(--hero); color: #fff; position: relative; overflow: hidden; box-shadow: var(--shadow2); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
.hero::before { width: 220px; height: 220px; right: -70px; top: -90px; }
.hero::after { width: 140px; height: 140px; right: 40px; bottom: -80px; }
.hero h1 { margin: 0; font-size: 25px; letter-spacing: -.02em; position: relative; z-index: 1; }
.hero p { margin: 4px 0 16px; opacity: .85; font-size: 14.5px; position: relative; z-index: 1; }
.hero .deco { position: absolute; right: 16px; top: 10px; font-family: Georgia, serif; font-style: italic; font-size: 64px; opacity: .14; z-index: 0; }
.searchbox { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.96); color: #475569; border-radius: 15px; padding: 13px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 15px; width: 100%; text-align: left; }
.searchbox svg { color: var(--pri); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; }
.sec-h h2 { font-size: 17.5px; margin: 0; letter-spacing: -.01em; }
.sec-h a, .sec-h button { font-size: 13.5px; color: var(--pri); font-weight: 700; }
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.qa { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s; text-align: center; line-height: 1.2; }
.qa:active { transform: scale(.95); }
.qa .qi { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-weight: 800; font-family: Georgia, serif; font-style: italic; font-size: 19px; }
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.area { position: relative; overflow: hidden; border-radius: 20px; padding: 16px 14px 14px; min-height: 132px; color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: var(--shadow); transition: transform .18s; }
.area:active { transform: scale(.97); }
.area .ai { position: absolute; right: 10px; top: 6px; font-size: 34px; font-weight: 800; opacity: .28; font-family: Georgia, serif; font-style: italic; letter-spacing: -.02em; }
.area b { font-size: 15.5px; line-height: 1.25; position: relative; }
.area small { opacity: .85; font-size: 12px; margin-top: 3px; position: relative; }
.area::after { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.1); left: -40px; top: -50px; }
.rowcard { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; width: 100%; text-align: left; box-shadow: var(--shadow); margin-bottom: 9px; transition: transform .15s; color: var(--ink); }
.rowcard:active { transform: scale(.98); }
.rowcard .rc-i { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; font-family: Georgia, serif; font-style: italic; }
.rowcard .rc-t { flex: 1; min-width: 0; }
.rowcard .rc-t b { display: block; font-size: 15px; line-height: 1.3; }
.rowcard .rc-t small { color: var(--muted); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowcard .chev { color: var(--muted); }
.daily { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.daily .lbl { font-size: 12px; font-weight: 800; color: var(--pri); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- Área / Lección ---------- */
.ahead { border-radius: 24px; padding: 22px 18px; color: #fff; margin: 6px 0 16px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.ahead .ai { position: absolute; right: 14px; top: 4px; font-size: 60px; opacity: .2; font-weight: 800; font-family: Georgia, serif; font-style: italic; }
.ahead h1 { margin: 0; font-size: 23px; letter-spacing: -.02em; position: relative; }
.ahead p { margin: 6px 0 0; opacity: .9; font-size: 14px; position: relative; }
.ahead .cnt { display: inline-block; margin-top: 12px; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; position: relative; }
.grp-h { font-size: 12.5px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 18px 4px 8px; }
.lesson h1 { font-size: 24px; margin: 8px 0 4px; letter-spacing: -.02em; line-height: 1.25; }
.lesson .crumb { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.lesson p { margin: 12px 0; }
.lesson ul { padding-left: 20px; margin: 10px 0; } .lesson li { margin: 6px 0; }
.fbox { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--pri); border-radius: 14px; padding: 12px 14px; margin: 12px 0; box-shadow: var(--shadow); }
.fbox .fn { font-size: 11.5px; font-weight: 800; color: var(--pri); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.fbox .fm { font-size: 17.5px; overflow-x: auto; padding: 2px 0; }
.tip { background: var(--why); border-radius: 14px; padding: 11px 14px; border-left: 4px solid var(--whyline); margin: 12px 0; font-size: 14.5px; }
.tip::before { content: "💡 "; }
.intro-b, .concl-b { border-radius: 16px; padding: 14px 16px; margin: 14px 0; position: relative; }
.intro-b { background: color-mix(in srgb, var(--pri) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--pri) 25%, transparent); }
.concl-b { background: var(--okbg); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.intro-b .tg, .concl-b .tg { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.intro-b .tg { color: var(--pri); } .concl-b .tg { color: var(--ok); }
.devel-tg { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 18px; }
.fig { margin: 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); color: var(--ink); }
.fig svg { width: 100%; height: auto; max-height: 320px; display: block; }
.fig figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: center; }
.fig .ax { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.fig .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; opacity: .75; }
.fig .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.fig .c1 { stroke: var(--c1); stroke-width: 2.6; fill: none; } .fig .c2 { stroke: var(--c2); stroke-width: 2.4; fill: none; } .fig .c3 { stroke: var(--c3); stroke-width: 2.4; fill: none; }
.fig .bar { fill: color-mix(in srgb, var(--c1) 22%, transparent); stroke: var(--c1); stroke-width: 1; }
.fig .fill1 { fill: color-mix(in srgb, var(--c1) 25%, transparent); }
.fig .tri { fill: color-mix(in srgb, var(--pri) 10%, transparent); stroke: var(--ink); stroke-width: 1.6; stroke-opacity: .7; }
.fig .blk { fill: color-mix(in srgb, var(--pri) 18%, var(--card)); stroke: var(--pri); stroke-width: 1.6; }
.fig .dot { fill: var(--c1); } .fig .dot2 { fill: var(--c2); } .fig .dot3 { fill: var(--c3); }
.fig .tx { fill: var(--ink); font-size: 13px; font-family: system-ui, sans-serif; } .fig .sm { font-size: 11px; } .fig .big { font-size: 18px; font-style: italic; }
.fig .c1t { fill: var(--c1); font-weight: 700; } .fig .c2t { fill: var(--c2); font-weight: 700; } .fig .c3t { fill: var(--c3); font-weight: 700; }
.wiki-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; background: #fff; margin: 10px 0; }
.src { font-size: 12.5px; color: var(--muted); margin-top: 16px; }
.src a { color: var(--pri); }

/* ---------- Tablas ---------- */
.tblw { overflow-x: auto; margin: 10px 0; border-radius: 12px; border: 1px solid var(--line); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); }
.tbl th { background: var(--card2); font-weight: 800; font-size: 12.5px; color: var(--muted); text-align: left; letter-spacing: .02em; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.lesson .tblw .tbl td { white-space: normal; min-width: 70px; }
.mat { border-collapse: separate; border-spacing: 10px 4px; margin: 6px auto; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; font-size: 15px; }
.mat td { text-align: center; min-width: 28px; }
.mat .ab { border-left: 1.5px dashed var(--muted); padding-left: 10px; }
.mat .ab2 { border-left: 1.5px dashed var(--muted); padding-left: 10px; }
.mat tr.hl td { color: var(--pri); font-weight: 800; }
.ruf { border-collapse: collapse; margin: 10px 0 4px; font-size: 14px; }
.ruf td { padding: 3px 10px; text-align: center; }
.ruf .rr { border-right: 1.5px solid var(--ink); }
.ruf tr.rl td { border-top: 1.5px solid var(--ink); font-weight: 800; }

/* ---------- Notación matemática ---------- */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
.fr > span { padding: 0 3px; line-height: 1.35; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; }
.rt { white-space: nowrap; } .rt .rad { border-top: 1.5px solid currentColor; padding: 0 2px; margin-left: 1px; }
.ig { font-size: 1.5em; font-weight: 300; vertical-align: middle; line-height: 1; font-family: Georgia, serif; font-style: italic; margin-right: 1px; }
.bd { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: .7em; line-height: 1.15; margin: 0 4px 0 -2px; }
.bd sup, .bd sub { vertical-align: baseline; font-size: 1em; }
.lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin-right: 4px; line-height: 1.1; }
.lim small { font-size: .7em; }
.hl { background: rgba(250,204,21,.35); border-radius: 4px; padding: 0 3px; }
i { font-family: Georgia, "Times New Roman", serif; }
sup { font-size: .72em; }

/* ---------- Resolver ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 30px; background: var(--card); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink); transition: all .25s; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; border-color: transparent; box-shadow: 0 6px 16px color-mix(in srgb, var(--pri) 35%, transparent); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 4px; font-size: 17px; }
.panel .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.fld { margin-bottom: 10px; }
.fld label { display: block; font-size: 12.5px; font-weight: 800; color: var(--muted); margin: 0 0 5px 2px; letter-spacing: .03em; }
.fld input, .fld textarea { font-size: 17px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.preview { min-height: 46px; padding: 10px 12px; border-radius: 12px; background: var(--card2); border: 1px dashed var(--line); font-size: 18px; overflow-x: auto; margin: 4px 0 12px; display: flex; align-items: center; }
.preview.err { color: var(--err); font-size: 13.5px; }
.preview .ph { color: var(--muted); font-size: 13.5px; }
.kp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 4px 0 14px; }
.kp button { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 0; font-size: 14.5px; font-weight: 600; transition: transform .1s, background .2s; }
.kp button:active { transform: scale(.92); background: color-mix(in srgb, var(--pri) 15%, var(--card2)); }
.kp button.k2 { color: var(--pri); }
.exs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.exs button { font-size: 13px; padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, var(--pri) 9%, transparent); color: var(--pri); font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
.exs span { font-size: 12px; color: var(--muted); width: 100%; font-weight: 700; }
.mlist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcard { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); transition: all .2s; color: var(--ink); }
.mcard b { display: block; font-size: 14.5px; }
.mcard small { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; margin-top: 2px; }
.mcard.on { border-color: var(--pri); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 20%, transparent); }

/* ---------- Resultado / pasos ---------- */
.res-wrap { margin-top: 16px; }
.inp-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
.inp-card .lbl { font-size: 11.5px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.inp-card .ex { font-size: 20px; margin-top: 6px; overflow-x: auto; }
.prog { height: 6px; background: var(--line); border-radius: 6px; margin: 14px 0 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--acc)); border-radius: 6px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.cnt { font-size: 12px; color: var(--muted); text-align: right; font-weight: 700; }
.step { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px; box-shadow: var(--shadow); position: relative; }
.step.new { animation: stepin .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes stepin { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.step .sn { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--pri); letter-spacing: .05em; text-transform: uppercase; }
.step .sn i { font-style: normal; font-family: inherit; width: 24px; height: 24px; border-radius: 8px; background: color-mix(in srgb, var(--pri) 14%, transparent); display: grid; place-items: center; font-size: 12px; }
.step .sw { font-weight: 700; margin: 6px 0 4px; font-size: 15.5px; }
.step .sm { font-size: 17.5px; overflow-x: auto; padding: 4px 0 8px; }
.step .sy { background: var(--why); border-left: 3px solid var(--whyline); border-radius: 10px; padding: 9px 11px; font-size: 14px; }
.step .sy b { color: var(--warn); }
.step.d1 { margin-left: 14px; border-left: 3px solid color-mix(in srgb, var(--pri) 45%, transparent); }
.step.d2 { margin-left: 26px; border-left: 3px solid color-mix(in srgb, var(--pri2) 45%, transparent); }
.step.d3, .step.d4, .step.d5 { margin-left: 34px; border-left: 3px solid color-mix(in srgb, var(--acc) 45%, transparent); }
.result { margin-top: 16px; border-radius: 20px; padding: 16px; text-align: center; background: var(--okbg); border: 2px solid var(--ok); color: var(--ok); font-size: 19px; font-weight: 800; overflow-x: auto; }
.result.new { animation: resin .6s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes resin { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
.result .rl { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; opacity: .85; }
.result small { font-weight: 600; opacity: .85; }
.result.fail { background: var(--why); border-color: var(--whyline); color: var(--warn); font-size: 15px; }
.note { margin-top: 10px; font-size: 13.5px; color: var(--muted); background: var(--card2); border-radius: 12px; padding: 9px 12px; }
.ctl { position: sticky; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom)); z-index: 5; display: flex; gap: 8px; margin-top: 16px; padding: 8px; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.ctl .btn { flex: 1; padding: 12px 8px; font-size: 14.5px; }
.ctl .btn-s { flex: .7; }

/* ---------- Ejemplos dentro de lecciones ---------- */
.exbox { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin: 16px 0; box-shadow: var(--shadow); }
.exbox .eh { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ok); letter-spacing: .08em; text-transform: uppercase; }
.exbox .eq { font-size: 18px; margin: 8px 0 4px; overflow-x: auto; }
.exbox .step { box-shadow: none; background: var(--card2); }
.exbox .ebtn { display: flex; gap: 8px; margin-top: 12px; }
.exbox .ebtn .btn { flex: 1; padding: 11px 8px; font-size: 14px; }
.trybtn { margin: 10px 0; width: 100%; }

/* ---------- Código ---------- */
.code { margin: 14px 0; border-radius: 18px; overflow: hidden; background: #0b1020; color: #e5e7eb; box-shadow: var(--shadow); border: 1px solid #1e293b; }
.code-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #111832; font-size: 12.5px; font-weight: 700; color: #94a3b8; }
.code-h .dots3 { display: flex; gap: 5px; } .code-h .dots3 i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.code pre { margin: 0; padding: 10px 0; overflow-x: auto; font: 13.5px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.code .ln { display: block; padding: 0 14px 0 0; white-space: pre; transition: background .25s; }
.code .ln .no { display: inline-block; width: 34px; text-align: right; color: #475569; margin-right: 12px; user-select: none; }
.code .ln.on { background: rgba(129,140,248,.22); box-shadow: inset 3px 0 0 #818cf8; }
.code .ln.on .no { color: #c7d2fe; }
.kw { color: #c084fc; } .st { color: #86efac; } .cm { color: #64748b; font-style: italic; } .nu { color: #fbbf24; } .fn2 { color: #60a5fa; }
.cexp { padding: 12px 14px; background: #111832; border-top: 1px solid #1e293b; min-height: 64px; font-size: 14px; color: #cbd5e1; }
.cexp b { color: #a5b4fc; }
.cbtn { display: flex; gap: 8px; padding: 0 14px 14px; background: #111832; }
.cbtn button { flex: 1; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 13.5px; background: #1e293b; color: #e2e8f0; }
.cbtn button.pp { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
.out { margin: -6px 0 14px; background: #020617; color: #a7f3d0; border-radius: 0 0 16px 16px; padding: 10px 14px; font: 13px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; border: 1px solid #1e293b; border-top: 0; }
.out::before { content: "Salida ▸"; display: block; color: #64748b; font-size: 11px; margin-bottom: 4px; }

/* ---------- Gráficas ---------- */
.plot { position: relative; margin: 14px 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--plot-bg); box-shadow: var(--shadow); }
.plot canvas { display: block; width: 100%; touch-action: none; }
.plot-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px; font-size: 12.5px; border-top: 1px solid var(--line); }
.plot-legend span { display: inline-flex; align-items: center; gap: 6px; }
.plot-legend i { width: 14px; height: 4px; border-radius: 3px; display: inline-block; }
.plot-tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.plot-tools button { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid var(--line); font-size: 16px; font-weight: 700; box-shadow: var(--shadow); }
.plot-info { position: absolute; left: 8px; top: 8px; font-size: 12px; background: color-mix(in srgb, var(--card) 92%, transparent); border-radius: 8px; padding: 0 8px; max-width: 75%; }
.plot-info:empty { display: none; }
.fnrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fnrow i.sw { width: 12px; height: 34px; border-radius: 6px; flex: none; }

/* ---------- Búsqueda ---------- */
#search { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; animation: sfade .28s ease both; }
@keyframes sfade { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.s-top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom: 1px solid var(--line); }
.s-in { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1.5px solid var(--pri); border-radius: 14px; padding: 0 12px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--pri) 15%, transparent); }
.s-in input { border: 0; background: transparent; padding: 12px 0; box-shadow: none !important; font-size: 16px; }
.s-in svg { color: var(--pri); }
.s-body { flex: 1; overflow-y: auto; padding: 8px 16px 40px; }
.s-sec { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 16px 2px 8px; display: flex; align-items: center; gap: 6px; }
.s-empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.s-sug { display: flex; flex-wrap: wrap; gap: 8px; }
.s-sug button { padding: 8px 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--ink); }
.solve-card { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin-bottom: 8px; box-shadow: var(--shadow2); }
.solve-card b { display: block; } .solve-card small { opacity: .85; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--pri); animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
mark { background: color-mix(in srgb, var(--pri) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- Ajustes / toast ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--pri); box-shadow: var(--shadow); }
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s; z-index: 80; max-width: 88%; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }
.about { text-align: center; color: var(--muted); font-size: 13px; margin: 26px 0; }
.err-box { background: color-mix(in srgb, var(--err) 10%, var(--card)); color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 35%, transparent); border-radius: 14px; padding: 12px 14px; margin-top: 14px; font-size: 14.5px; }

@media (min-width: 700px) {
  .agrid { grid-template-columns: repeat(3, 1fr); }
  .qgrid { grid-template-columns: repeat(8, 1fr); }
  .mlist { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 360px) { .kp button { font-size: 13px; } .qa { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Legal ---------- */
.legal h3 { font-size: 16.5px; margin: 20px 0 6px; color: var(--pri); }
.legal p, .legal li { font-size: 15px; }
.legal a, .about a, #lgate a { color: var(--pri); font-weight: 600; }
.lg-upd { color: var(--muted); font-size: 13px !important; }
.lg-card { text-align: center; padding: 18px 0 8px; }
.lg-card h2 { margin: 8px 0 0; letter-spacing: .1em; }
.lg-sub { color: var(--muted); margin: 2px 0 0; }
.lg-logo { width: 74px; height: 74px; border-radius: 22px; margin: 0 auto; display: grid; place-items: center; background: var(--hero); color: #fff; font: italic 300 44px Georgia, serif; box-shadow: var(--shadow2); }
.lg-tbl td { white-space: normal !important; }
#lgate { position: fixed; inset: 0; z-index: 95; background: color-mix(in srgb, #0b1020 55%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: end center; animation: sfade .3s ease both; }
.lg-box { width: 100%; max-width: 560px; background: var(--card); border-radius: 26px 26px 0 0; padding: 26px 22px calc(22px + env(safe-area-inset-bottom)); text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,.3); animation: up .45s cubic-bezier(.2,.8,.2,1) both; }
.lg-box h2 { margin: 14px 0 6px; font-size: 22px; }
.lg-box p { color: var(--ink); margin: 8px 0; font-size: 15px; }
.lg-sm { color: var(--muted) !important; font-size: 13.5px !important; }
.lg-chk { display: flex; gap: 10px; align-items: flex-start; text-align: left; margin: 16px 0; font-size: 14.5px; font-weight: 600; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
.lg-chk input { width: 22px; height: 22px; flex: none; accent-color: var(--pri); margin: 0; }
.lg-own { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.lg-read { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; padding: 0 16px 40px; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.8,.2,1); z-index: 2; }
.lg-read.on { transform: none; }
.lg-rh { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 0 10px; background: var(--bg); border-bottom: 1px solid var(--line); }

/* ============ Calculadora científica ============ */
.calc { margin-top: 4px; }
.cdisp { background: linear-gradient(160deg, #0f172a, #1e1b4b 70%, #312e81); color: #e2e8f0; border-radius: 22px; padding: 12px 14px 14px; box-shadow: var(--shadow2); }
.cind { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .06em; min-height: 26px; }
.cind b { opacity: .28; font-weight: 800; transition: opacity .2s; }
.cind b#cA, .cind b.on { opacity: 1; color: #a5b4fc; }
.ctg { color: #c7d2fe; border: 1px solid rgba(165,180,252,.35); border-radius: 9px; padding: 4px 9px; font-size: 12px; font-weight: 800; min-height: 26px; }
.ctg.on { background: #6366f1; color: #fff; border-color: transparent; }
#cIn { width: 100%; background: transparent; border: 0; outline: 0; color: #fff; font-size: 22px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 6px 0; caret-color: #a5b4fc; }
#cIn::placeholder { color: rgba(226,232,240,.35); }
.cres { text-align: right; font-size: 34px; font-weight: 800; letter-spacing: -.02em; min-height: 44px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cres .pv { color: rgba(226,232,240,.5); font-size: 24px; font-weight: 700; }
.cres .er { color: #fca5a5; font-size: 15px; font-weight: 700; white-space: normal; }
.calt { text-align: right; color: #a5b4fc; font-size: 16px; min-height: 8px; }
.calt .fr { vertical-align: middle; }
.ckeys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 12px; }
.ckeys button { position: relative; min-height: 48px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 700; font-size: 15px; box-shadow: 0 1px 2px rgba(15,23,42,.06); padding: 12px 2px 4px; transition: transform .1s, background .2s; }
.ckeys button:active { transform: scale(.93); }
.ckeys button small { position: absolute; top: 3px; left: 0; right: 0; font-size: 9.5px; font-weight: 700; color: #d97706; letter-spacing: 0; }
.ckeys .kn { background: var(--card2); font-size: 19px; padding-top: 6px; }
.ckeys .ko { background: color-mix(in srgb, var(--pri) 14%, var(--card)); color: var(--pri); font-size: 21px; padding-top: 6px; }
.ckeys .kd { background: color-mix(in srgb, #ef4444 15%, var(--card)); color: #dc2626; padding-top: 6px; }
.ckeys .kf { font-size: 13px; color: var(--muted); padding-top: 6px; }
.ckeys .kf.act { background: #d97706; color: #fff; border-color: transparent; }
.ckeys .keq { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; font-size: 22px; border: 0; padding-top: 6px; }
.chist { display: flex; flex-direction: column; gap: 6px; }
.chist button { display: flex; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
.chist span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.chist b { white-space: nowrap; }
.clist { display: flex; flex-direction: column; gap: 7px; }
.clist button { display: flex; align-items: center; gap: 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; color: var(--ink); }
.clist .cs { flex: none; width: 46px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, #f97316, #c2410c); color: #fff; font-weight: 800; font-family: Georgia, serif; font-style: italic; font-size: 17px; }
.clist .ct { display: flex; flex-direction: column; min-width: 0; }
.clist small { color: var(--muted); font-size: 12.5px; }
/* ============ Resolver con foto ============ */
.hbtns { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.hbtns button { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; border-radius: 14px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); color: #fff; font-weight: 700; font-size: 14px; backdrop-filter: blur(6px); }

    if (!isFinite(a) || !isFinite(b)) continue;
    tot++; if (Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(a), Math.abs(b))) ok++;

  return tot === 0 ? null : ok === tot;
}
function numDeriv(f, x, p) { const e = {}; const hh = 1e-5; e[x] = p + hh; const a = evalN(f, e); e[x] = p - hh; const b = evalN(f, e); return (a - b) / (2 * hh); }

/* =========================================================
   DERIVADAS
   ========================================================= */
const DT = {
  sin: u => Fn('cos', u),
  cos: u => Neg(Fn('sin', u)),
  tan: u => Pow(Fn('sec', u), N(2)),
  sec: u => Mul([Fn('sec', u), Fn('tan', u)]),
  csc: u => Neg(Mul([Fn('csc', u), Fn('cot', u)])),
  cot: u => Neg(Pow(Fn('csc', u), N(2))),
  ln: u => Pow(u, N(-1)),
  log: u => Pow(Mul([u, Fn('ln', N(10))]), N(-1)),
  arcsin: u => Pow(Sub(N(1), Pow(u, N(2))), N(new Q(-1, 2))),
  arccos: u => Neg(Pow(Sub(N(1), Pow(u, N(2))), N(new Q(-1, 2)))),
  arctan: u => Pow(Add([N(1), Pow(u, N(2))]), N(-1)),
  sinh: u => Fn('cosh', u), cosh: u => Fn('sinh', u), tanh: u => Pow(Fn('cosh', u), N(-2)),
  abs: u => Mul([u, Pow(Fn('abs', u), N(-1))])
};
const DTXT = {
  sin: 'd/dx[sen u] = cos u', cos: 'd/dx[cos u] = −sen u', tan: 'd/dx[tan u] = sec²u', sec: 'd/dx[sec u] = sec u·tan u',
  csc: 'd/dx[csc u] = −csc u·cot u', cot: 'd/dx[cot u] = −csc²u', ln: 'd/dx[ln u] = 1/u', log: 'd/dx[log u] = 1/(u·ln 10)',
  arcsin: 'd/dx[arcsen u] = 1/√(1−u²)', arccos: 'd/dx[arccos u] = −1/√(1−u²)', arctan: 'd/dx[arctan u] = 1/(1+u²)',
  sinh: 'd/dx[senh u] = cosh u', cosh: 'd/dx[cosh u] = senh u', tanh: 'd/dx[tanh u] = 1/cosh²u', abs: 'd/dx|u| = u/|u|'
};

function derivQuiet(u, x) { return simplify(deriv(u, x, [], 0)); }

function innerDeriv(u, x, S, d) { // derivada de la función interna (u′) en la regla de la cadena
  const tmp = [];
  const du = simplify(deriv(u, x, tmp, d + 1));
  if (tmp.length <= 2 || toPoly(u, x)) {
    step(S, d + 1, 'Derivada de la función de adentro', `u = ${H(u)} &nbsp;⇒&nbsp; u′ = ${H(du)}`,
      toPoly(u, x) ? 'Se deriva u con la regla de la potencia término a término.' : (tmp[tmp.length - 1] || {}).y || 'Se deriva u con las reglas básicas.');
  } else {
    step(S, d + 1, 'Derivamos la función de adentro', `u = ${H(u)}`, 'Necesitamos u′ para la regla de la cadena. La calculamos aparte:');
    S.push(...tmp);
    step(S, d + 1, 'Resultado de la función de adentro', `u′ = ${H(du)}`, 'Esta es la derivada de la función interna.');
  }
  return du;
}

function deriv(u, x, S, d) {
  u = simplify(u);
  const D = D_(x);
  if (!has(u, x)) { step(S, d, 'Derivada de una constante', `${D(u)} = 0`, `${H(u)} no depende de ${x}: una constante no cambia, por eso su derivada es 0.`); return N(0); }
  if (u.t === 'var') { step(S, d, 'Derivada de la variable', `${D(u)} = 1`, `La derivada de ${x} respecto a sí misma es 1 (es xⁿ con n = 1: 1·x⁰ = 1).`); return N(1); }

  if (u.t === 'add') {
    step(S, d, 'Regla de la suma', `${D(u)} = ${u.a.map((t, i) => (i && M.isNegTerm(t) ? '− ' + D(M.simplify(Neg(t))) : (i ? '+ ' : '') + D(t))).join(' ')}`,
      'La derivada de una suma o resta es la suma o resta de las derivadas. Derivamos cada término por separado.');
    const parts = u.a.map(t => deriv(t, x, S, d + 1));
    const r = simplify(Add(parts));
    step(S, d, 'Juntamos los términos', `${D(u)} = ${H(r)}`, 'Sumamos (o restamos) las derivadas de cada término.');
    return r;
  }

  const mo = monomial(u, x);
  if (mo) {
    const n = mo.n, cS = isNum(mo.c, 1) ? '' : (pr(mo.c) + '·');
    const r = simplify(Mul([mo.c, N(n), Pow(V(x), N(n.sub(ONE)))]));
    const ns = H(N(n), { inl: true }), nm1 = H(N(n.sub(ONE)), { inl: true });
    step(S, d, 'Regla de la potencia', `${D(u)} = ${cS}${n.isNeg() || !n.isInt() ? P(ns) : ns}·<i>${x}</i><sup>${ns} − 1</sup> = ${H(r)}`,
      `Regla: d/dx[xⁿ] = n·xⁿ⁻¹. El exponente (${ns}) baja a multiplicar y al exponente se le resta 1 (${ns} − 1 = ${nm1}).` +
      (cS ? ` La constante ${H(mo.c)} se queda multiplicando (regla del múltiplo constante).` : '') +
      (n.isNeg() || !n.isInt() ? ' La regla funciona igual con exponentes negativos o fraccionarios.' : ''));
    return r;
  }

  if (u.t === 'mul') {
    const cp = u.a.filter(f => !has(f, x)), vp = u.a.filter(f => has(f, x));
    if (cp.length) {
      const c = simplify(Mul(cp)), v = vp.length === 1 ? vp[0] : simplify(Mul(vp));
      step(S, d, 'Sacamos la constante', `${D(u)} = ${pr(c)}·${D(v)}`, `Regla del múltiplo constante: d/dx[k·f] = k·f′. La constante ${H(c)} se queda afuera multiplicando y derivamos sólo lo que tiene ${x}.`);
      const dv = deriv(v, x, S, d + 1);
      const r = simplify(Mul([c, dv]));
      step(S, d, 'Multiplicamos por la constante', `${pr(c)}·${pr(simplify(dv))} = ${H(r)}`, 'Multiplicamos la constante por la derivada obtenida.');
      return r;
    }
    const { nums, dens } = mulParts(u);
    if (dens.length && nums.length) {
      const Nn = simplify(nums.length === 1 ? nums[0] : Mul(nums)), Dd = simplify(dens.length === 1 ? dens[0] : Mul(dens));
      step(S, d, 'Regla del cociente', `${D(u)} = ${fr(`${D(Nn)}·${pr(Dd)} − ${pr(Nn)}·${D(Dd)}`, `${pr(Dd)}<sup>2</sup>`)}`,
        'Para un cociente f = u/v se usa: f′ = (u′·v − u·v′) / v². “La derivada de arriba por la de abajo sin derivar, menos la de arriba sin derivar por la derivada de abajo, todo entre la de abajo al cuadrado.”');
      step(S, d + 1, 'Identificamos u y v', `u = ${H(Nn)} &nbsp;&nbsp; v = ${H(Dd)}`, 'u es el numerador y v el denominador.');
      const du = simplify(deriv(Nn, x, S, d + 1)), dv = simplify(deriv(Dd, x, S, d + 1));
      const num = Sub(Mul([du, Dd]), Mul([Nn, dv]));
      step(S, d, 'Sustituimos en la fórmula del cociente', `${fr(`${pr(du)}·${pr(Dd)} − ${pr(Nn)}·${pr(dv)}`, `${pr(Dd)}<sup>2</sup>`)}`, 'Colocamos u, v, u′ y v′ en la fórmula.');
      let numS = simplify(num); const ex = expand(numS);
      if (size(ex) <= size(numS) * 1.6) numS = ex;
      const r = simplify(Mul([numS, Pow(Dd, N(-2))]));
      step(S, d, 'Simplificamos el numerador', `${D(u)} = ${fr(H(numS), `${pr(Dd)}<sup>2</sup>`)}`, 'Multiplicamos (propiedad distributiva) y agrupamos términos semejantes en el numerador. El denominador se deja indicado.');
      return { ...r, _pretty: fr(H(numS), `${pr(Dd)}<sup>2</sup>`) };
    }
    const fs = u.a; const a = fs[0], b = fs.length === 2 ? fs[1] : simplify(Mul(fs.slice(1)));
    step(S, d, 'Regla del producto', `${D(u)} = ${D(a)}·${pr(b)} + ${pr(a)}·${D(b)}`,
      'Para un producto u·v se usa: (u·v)′ = u′·v + u·v′. “La derivada del primero por el segundo sin derivar, más el primero sin derivar por la derivada del segundo.”');
    step(S, d + 1, 'Identificamos u y v', `u = ${H(a)} &nbsp;&nbsp; v = ${H(b)}`, 'Separamos el producto en dos factores.');
    const da = simplify(deriv(a, x, S, d + 1)), db = simplify(deriv(b, x, S, d + 1));
    const raw = Add([Mul([da, b]), Mul([a, db])]);
    step(S, d, 'Sustituimos en la fórmula del producto', `${pr(da)}·${pr(b)} + ${pr(a)}·${pr(db)}`, 'Colocamos u′, v, u y v′ en la fórmula.');
    let r = simplify(raw);
    const ex = expand(r);
    if (toPoly(ex, x) || size(ex) < size(r)) {
      if (M.key(ex) !== M.key(r)) step(S, d, 'Multiplicamos y agrupamos términos semejantes', `= ${H(ex)}`, 'Aplicamos la propiedad distributiva en cada producto (al multiplicar potencias de la misma base se suman los exponentes) y luego sumamos los términos que tienen la misma potencia.');
      r = ex;
    }
    return r;
  }

  if (u.t === 'pow') {
    const b = u.b, e = u.e;
    if (!has(e, x)) {
      step(S, d, 'Regla de la cadena (potencia)', `${D(u)} = ${pr(e)}·${pr(b)}<sup>${H(simplify(Sub(e, N(1))), { inl: true })}</sup>·u′ &nbsp; con u = ${H(b)}`,
        'La base no es simplemente x, sino una función u. Regla de la potencia generalizada: d/dx[uⁿ] = n·uⁿ⁻¹·u′. Se deriva “la de afuera” (la potencia) y se multiplica por la derivada de “la de adentro”.');
      const du = innerDeriv(b, x, S, d);
      const r = simplify(Mul([e, Pow(b, Sub(e, N(1))), du]));
      step(S, d, 'Resultado de la cadena', `${D(u)} = ${H(r)}`, `Multiplicamos n·uⁿ⁻¹ por u′ = ${H(du)}.`);
      return r;
    }
    if (!has(b, x)) {
      const isE = b.t === 'const' && b.n === 'e';
      if (e.t === 'var') {
        const r = isE ? u : simplify(Mul([u, Fn('ln', b)]));
        step(S, d, isE ? 'Derivada de la exponencial' : 'Derivada de la exponencial de base a', `${D(u)} = ${H(r)}`, isE ? 'La función eˣ es su propia derivada: d/dx[eˣ] = eˣ.' : 'd/dx[aˣ] = aˣ·ln a.');
        return r;
      }
      step(S, d, 'Regla de la cadena (exponencial)', `${D(u)} = ${H(u)}·${isE ? '' : 'ln ' + pr(b) + '·'}u′ &nbsp; con u = ${H(e)}`,
        isE ? 'd/dx[eᵘ] = eᵘ·u′: la exponencial queda igual y se multiplica por la derivada del exponente.' : 'd/dx[aᵘ] = aᵘ·ln(a)·u′.');
      const du = innerDeriv(e, x, S, d);
      const r = simplify(isE ? Mul([du, u]) : Mul([du, u, Fn('ln', b)]));
      step(S, d, 'Resultado', `${D(u)} = ${H(r)}`, 'Multiplicamos por la derivada del exponente.');
      return r;
    }
    // f(x)^g(x): derivación logarítmica
    step(S, d, 'Derivación logarítmica', `y = ${H(u)} &nbsp;⇒&nbsp; ln y = ${pr(e)}·ln${P(H(b))}`, 'Cuando la variable está en la base y en el exponente, se toma logaritmo natural a ambos lados para bajar el exponente (propiedad ln(aᵇ) = b·ln a).');
    const g = simplify(Mul([e, Fn('ln', b)]));
    const dg = simplify(deriv(g, x, S, d + 1));
    const r = simplify(Mul([u, dg]));
    step(S, d, 'Despejamos y′', `${fr('y′', 'y')} = ${H(dg)} &nbsp;⇒&nbsp; y′ = ${H(r)}`, 'Derivando ln y obtenemos y′/y (regla de la cadena). Multiplicamos por y = la función original.');
    return r;
  }

  if (u.t === 'fn') {
    const f = DT[u.n]; if (!f) throw new Error('No sé derivar la función ' + u.n);
    const arg = u.a;
    if (arg.t === 'var' && arg.n === x) {
      const r = simplify(f(arg));
      step(S, d, 'Derivada de tabla', `${D(u)} = ${H(r)}`, `Fórmula de la tabla de derivadas: ${DTXT[u.n].replace(/u/g, x)}.`);
      return r;
    }
    step(S, d, 'Regla de la cadena', `${D(u)} = ${H(simplify(f(V('u'))))}·u′ &nbsp; con u = ${H(arg)}`,
      `Función compuesta: f(g(x))′ = f′(g(x))·g′(x). Fórmula: ${DTXT[u.n]}. Derivamos “la de afuera” dejando igual lo de adentro, y multiplicamos por la derivada de “la de adentro”.`);
    const du = innerDeriv(arg, x, S, d);
    const r = simplify(Mul([f(arg), du]));
    step(S, d, 'Resultado de la cadena', `${D(u)} = ${H(r)}`, `Multiplicamos ${H(simplify(f(arg)))} por u′ = ${H(du)}.`);
    return r;
  }
  throw new Error('No se pudo derivar');
}

function solveDerivative(str, x, order) {
  x = x || 'x'; order = order || 1; M.setMainVar(x);
  const f0 = simplify(M.parse(str));
  const S = [];
  let cur = f0, pretty = null;
  if (hasRawForm(f0, x)) step(S, 0, 'Reescribimos con exponentes', `f(${x}) = ${H(f0)} = ${H(f0, { raw: true })}`, 'Propiedades: 1/xⁿ = x⁻ⁿ y ⁿ√x = x^(1/n). Así se puede aplicar la regla de la potencia a raíces y a fracciones.');
  for (let k = 1; k <= order; k++) {
    if (order > 1) step(S, 0, `<b>Derivada número ${k}</b>`, `${k === 1 ? 'f' : 'f' + '′'.repeat(k - 1)}(${x}) = ${H(cur)}`, k === 1 ? 'Empezamos con la función original.' : 'Volvemos a derivar el resultado anterior.');
    const r = deriv(cur, x, S, 0);
    pretty = r._pretty || null;
    cur = simplify(r);
  }
  // verificación numérica
  let ok = null;
  if (order === 1) {
    const pts = [0.37, 0.81, 1.23, 1.71, 2.3, -0.6]; let good = 0, tot = 0;
    for (const p of pts) { const nd = numDeriv(f0, x, p); const e = {}; e[x] = p; const v = evalN(cur, e); if (isFinite(nd) && isFinite(v) && Math.abs(nd) < 1e6) { tot++; if (Math.abs(nd - v) < 1e-4 * Math.max(1, Math.abs(v))) good++; } }
    ok = tot ? good === tot : null;
  }
  const name = 'f' + '′'.repeat(Math.min(order, 3)) + (order > 3 ? `<sup>(${order})</sup>` : '');
  return { steps: S, input: `f(${x}) = ${H(f0)}`, result: `${name}(${x}) = ${pretty && order === 1 ? pretty : H(cur)}`, resultAST: cur, f: f0, x, ok,
    plot: { fns: [{ e: f0, label: 'f(' + x + ')' }, { e: cur, label: name + '(' + x + ')' }], x } };
}

/* =========================================================
   INTEGRALES
   ========================================================= */
function I_(x) { return (w) => `${IG} ${H(w)} d<i>${x}</i>`; }

function tableIntegral(u, x) { // patrones de tabla, un solo paso
  const X = V(x);
  // x^n
  const mo = monomial(u, x);
  if (mo && isNum(mo.c, 1)) {
    const n = mo.n;
    if (n.eq(new Q(-1))) return { r: Fn('ln', Fn('abs', X)), w: 'Integral de 1/x', y: `${IG} x⁻¹ dx = ln|x| + C. Es el único caso donde no sirve la regla de la potencia (dividiría entre 0).` };
    const n1 = n.add(ONE);
    return { r: simplify(Mul([N(n1.inv()), Pow(X, N(n1))])), w: 'Regla de la potencia para integrales',
      m: `${I_(x)(u)} = ${fr(`<i>${x}</i><sup>${H(N(n), { inl: true })} + 1</sup>`, H(N(n), { inl: true }) + ' + 1')}`,
      y: `${IG} xⁿ dx = xⁿ⁺¹/(n+1) + C. Se SUMA 1 al exponente (${H(N(n), { inl: true })} + 1 = ${H(N(n1), { inl: true })}) y se DIVIDE entre el nuevo exponente.` };
  }
  if (u.t === 'pow') {
    const L = linear(u.b, x);
    if (L && !has(u.e, x) && u.e.t === 'num') {
      const n = u.e.v;
      if (n.eq(new Q(-1))) return { r: simplify(Mul([N(L.a.inv()), Fn('ln', Fn('abs', u.b))])), w: 'Integral de 1/(ax+b)', y: `Con u = ${H(u.b)}, du = ${H(N(L.a))} dx: ${IG} du/u = ln|u|. Por eso se divide entre ${H(N(L.a))}.` };
      const n1 = n.add(ONE);
      return { r: simplify(Mul([N(L.a.mul(n1).inv()), Pow(u.b, N(n1))])), w: 'Potencia de un binomio lineal',
        y: `Sustitución u = ${H(u.b)} ⇒ du = ${H(N(L.a))} dx. Queda ${IG} uⁿ du / ${H(N(L.a))} = uⁿ⁺¹/((n+1)·${H(N(L.a))}). Se suma 1 al exponente y se divide entre el nuevo exponente y entre el coeficiente de x (${H(N(L.a))}).` };
    }
    if (!has(u.b, x)) {
      const L2 = linear(u.e, x);
      if (L2) {
        const isE = u.b.t === 'const' && u.b.n === 'e';
        if (isE) return { r: simplify(Mul([N(L2.a.inv()), u])), w: 'Integral de la exponencial', y: L2.a.isOne() ? `${IG} eˣ dx = eˣ + C: la exponencial es su propia integral.` : `${IG} e^(ax+b) dx = e^(ax+b)/a + C (sustitución u = ${H(u.e)}, du = ${H(N(L2.a))} dx).` };
        return { r: simplify(Mul([N(L2.a.inv()), u, Pow(Fn('ln', u.b), N(-1))])), w: 'Exponencial de base a', y: `${IG} aᵘ du = aᵘ / ln a + C.` };
      }
    }
    // sec², csc², 1/cos²
    if (u.b.t === 'fn' && isNum(u.e, 2) && ['sec', 'csc'].includes(u.b.n)) {
      const L3 = linear(u.b.a, x);
      if (L3) return u.b.n === 'sec' ? { r: simplify(Mul([N(L3.a.inv()), Fn('tan', u.b.a)])), w: 'Integral de sec²', y: `${IG} sec²u du = tan u + C, porque (tan u)′ = sec²u.` }
        : { r: simplify(Mul([N(L3.a.inv().neg()), Fn('cot', u.b.a)])), w: 'Integral de csc²', y: `${IG} csc²u du = −cot u + C.` };
    }
    if (u.b.t === 'fn' && isNum(u.e, -2) && ['cos', 'sin'].includes(u.b.n)) {
      const L3 = linear(u.b.a, x);
      if (L3) return u.b.n === 'cos' ? { r: simplify(Mul([N(L3.a.inv()), Fn('tan', u.b.a)])), w: 'Integral de 1/cos² = sec²', y: `1/cos²u = sec²u y ${IG} sec²u du = tan u + C.` }
        : { r: simplify(Mul([N(L3.a.inv().neg()), Fn('cot', u.b.a)])), w: 'Integral de 1/sen² = csc²', y: `${IG} csc²u du = −cot u + C.` };
    }
    // 1/(p x² + q), 1/√(q − p x²), 1/√(x² + q)
    const pq = toPoly(u.b, x);
    if (pq && pdeg(pq) === 2 && pq[1].isZero() && u.e.t === 'num') {
      const p = pq[2], q = pq[0];
      if (u.e.v.eq(new Q(-1)) && p.n > 0 && q.n > 0) {
        const c = q.div(p), sc = simplify(Pow(N(c), N(new Q(1, 2))));
        return { r: simplify(Mul([N(p.inv()), Pow(sc, N(-1)), Fn('arctan', Mul([X, Pow(sc, N(-1))]))])), w: 'Forma del arcotangente',
          y: `${IG} du/(u² + a²) = (1/a)·arctan(u/a) + C. Aquí, sacando ${H(N(p))} de factor común, a² = ${H(N(c))} ⇒ a = ${H(sc)}.` };
      }
      if (u.e.v.eq(new Q(-1, 2)) && p.n < 0 && q.n > 0) {
        const pp = p.neg(), c = q.div(pp), sc = simplify(Pow(N(c), N(new Q(1, 2))));
        return { r: simplify(Mul([Pow(N(pp), N(new Q(-1, 2))), Fn('arcsin', Mul([X, Pow(sc, N(-1))]))])), w: 'Forma del arcoseno',
          y: `${IG} du/√(a² − u²) = arcsen(u/a) + C, con a = ${H(sc)}.` };
      }
      if (u.e.v.eq(new Q(-1, 2)) && p.isOne()) {
        return { r: Fn('ln', Fn('abs', Add([X, Pow(u.b, N(new Q(1, 2)))]))), w: 'Forma logarítmica', y: `${IG} du/√(u² + a) = ln|u + √(u² + a)| + C.` };
      }
    }
  }
  if (u.t === 'fn') {
    const L = linear(u.a, x); if (!L) return null;
    const k = N(L.a.inv()), a = u.a;
    const T = {
      sin: [Neg(Fn('cos', a)), `${IG} sen u du = −cos u + C, porque (cos u)′ = −sen u.`],
      cos: [Fn('sin', a), `${IG} cos u du = sen u + C, porque (sen u)′ = cos u.`],
      tan: [Neg(Fn('ln', Fn('abs', Fn('cos', a)))), `${IG} tan u du = −ln|cos u| + C (tan = sen/cos y se sustituye w = cos u).`],
      cot: [Fn('ln', Fn('abs', Fn('sin', a))), `${IG} cot u du = ln|sen u| + C.`],
      sec: [Fn('ln', Fn('abs', Add([Fn('sec', a), Fn('tan', a)]))), `${IG} sec u du = ln|sec u + tan u| + C.`],
      csc: [Neg(Fn('ln', Fn('abs', Add([Fn('csc', a), Fn('cot', a)])))), `${IG} csc u du = −ln|csc u + cot u| + C.`],
      sinh: [Fn('cosh', a), `${IG} senh u du = cosh u + C.`], cosh: [Fn('sinh', a), `${IG} cosh u du = senh u + C.`]
    }[u.n];
    if (!T) return null;
    return { r: simplify(Mul([k, T[0]])), w: 'Integral de tabla', y: T[1] + (L.a.isOne() ? '' : ` Como u = ${H(a)}, du = ${H(N(L.a))} dx, se divide entre ${H(N(L.a))}.`) };
  }
  if (u.t === 'mul' && u.a.length === 2 && u.a.every(f => f.t === 'fn') && same(u.a[0].a, u.a[1].a)) {

    `u se deriva (du) y dv se integra (v). ${{ L: 'El logaritmo va primero en LIATE', I: 'La inversa trigonométrica va primero', A: 'La parte algebraica (polinomio) se escoge como u porque al derivarla baja de grado', T: 'La trigonométrica va antes que la exponencial' }[cs[idx]]}.`);

  step(S, 0, 'Fórmula de la regla falsa', `c = b − ${fr('f(b)·(a − b)', 'f(a) − f(b)')}`, 'En vez del punto medio, se toma el corte con el eje x de la recta (secante) que une (a, f(a)) y (b, f(b)). Luego se elige el subintervalo con cambio de signo, igual que en bisección. Suele converger más rápido.');

}

/* ---------- Newton-Raphson ---------- */
function newton(fs, x0s, tols, maxs) {
  const { u, f } = fn1(fs); const du = CA.derivQuiet(u, 'x'); const df = (t) => evalN(du, { x: t });
  let x = num(x0s); const tol = num(tols || '0.0001'); const max = parseInt(maxs) || 50;
  const S = []; const rows = [];
  step(S, 0, 'Calculamos la derivada', `f′(x) = ${H(du)}`, 'Newton-Raphson usa la recta tangente, así que necesita la derivada de f.');
  step(S, 0, 'Fórmula de Newton-Raphson', `x<sub>n+1</sub> = x<sub>n</sub> − ${fr('f(x<sub>n</sub>)', 'f′(x<sub>n</sub>)')}`, 'Desde xₙ se traza la tangente a la curva y se toma donde corta al eje x. Converge muy rápido (cuadráticamente) si el punto inicial está cerca de la raíz y f′ ≠ 0.');
  let i;
  for (i = 0; i < max; i++) {
    const fx = f(x), dfx = df(x);
    if (dfx === 0 || !isFinite(dfx)) throw new Error('f′(x) = 0 en x = ' + fmt(x) + '. Elige otro punto inicial.');
    const xn = x - fx / dfx, ea = Math.abs(xn - x);
    rows.push([i, f6(x), f6(fx), f6(dfx), f6(xn), f6(ea), xn !== 0 ? fmt(erp(x, xn), 4) + '%' : '—']);
    x = xn; if (ea < tol) break;
  }
  step(S, 0, 'Tabla de iteraciones', table(['n', 'xₙ', 'f(xₙ)', 'f′(xₙ)', 'xₙ₊₁', 'Error abs.', 'Error rel.'], rows), `Se detiene cuando |xₙ₊₁ − xₙ| < ${tols || '0.0001'}.`);
  return { steps: S, input: `f(x) = ${H(u)}, x₀ = ${x0s}`, result: `Raíz ≈ ${fmt(x, 10)}`, plot: { fns: [{ e: u, label: 'f(x)' }], x: 'x', roots: [x] } };
}

/* ---------- Secante ---------- */
function secante(fs, x0s, x1s, tols, maxs) {
  const { u, f } = fn1(fs); let x0 = num(x0s), x1 = num(x1s); const tol = num(tols || '0.0001'); const max = parseInt(maxs) || 50;

  step(S, 0, 'Fórmula de la secante', `x<sub>n+1</sub> = x<sub>n</sub> − ${fr('f(x<sub>n</sub>)·(x<sub>n</sub> − x<sub>n−1</sub>)', 'f(x<sub>n</sub>) − f(x<sub>n−1</sub>)')}`, 'Es como Newton, pero la derivada se aproxima con la pendiente de la recta que pasa por los dos últimos puntos. No necesita derivar.');
  let i;

    const x2 = x1 - f1 * (x1 - x0) / (f1 - f0), ea = Math.abs(x2 - x1);
    rows.push([i, f6(x0), f6(x1), f6(f0), f6(f1), f6(x2), f6(ea)]);

}

/* ---------- Punto fijo ---------- */

/* ---------- Trapecio / Simpson ---------- */
function nodes(f, a, b, n) { const h = (b - a) / n; const xs = [], ys = []; for (let i = 0; i <= n; i++) { xs.push(a + i * h); ys.push(f(a + i * h)); } return { h, xs, ys }; }

  const { h, xs, ys } = nodes(f, a, b, n);

    }

}

/* ---------- EDO: Euler, Heun, RK4 ---------- */
function euler(fs, x0s, y0s, hs, ns) {
  const { u, f } = fnXY(fs); let x = num(x0s), y = num(y0s); const h = num(hs), n = parseInt(ns) || 5;

  step(S, 0, 'Tabla', table(['n', 'xₙ', 'yₙ', 'f(xₙ, yₙ)', 'yₙ₊₁ = yₙ + h·f'], rows), `h = ${hs}`);
  return { steps: S, input: `y′ = ${H(u)}, y(${x0s}) = ${y0s}, h = ${hs}, n = ${n}`, result: `y(${fmt(x)}) ≈ ${fmt(y, 8)}`, plot: { pts, x: 'x' } };
}

  const S = []; const rows = []; const pts = [[x, y]];

}

/* ---------- Interpolación ---------- */
function parsePoints(s) {
  const pts = String(s).split(/[;\n]+/).map(p => p.trim()).filter(Boolean).map(p => p.replace(/[()]/g, '').split(/[,\s]+/).filter(Boolean).map(v => simplify(M.parse(v))));

  return pts;
}

  const terms = [];
  pts.forEach(([xi, yi], i) => {
    const facs = []; let den = M.N(1);
    pts.forEach(([xj], j) => { if (j !== i) { facs.push(M.Sub(X, xj)); den = M.Mul([den, M.Sub(xi, xj)]); } });
    const Li = simplify(M.Mul([...facs, M.Pow(den, M.N(-1))]));
    step(S, 1, `L<sub>${i}</sub>(x)`, `L<sub>${i}</sub>(x) = ${fr(facs.map(f => '(' + H(simplify(f)) + ')').join(''), H(simplify(den)))} = ${H(M.expand(Li))}`, `Producto de (x − xⱼ)/(x${i} − xⱼ) para todos los j ≠ ${i}.`);
    terms.push(M.Mul([yi, Li]));
  });
  const P = M.expand(M.Add(terms));
  step(S, 0, 'Sumamos yᵢ·Lᵢ(x)', `P(x) = ${H(P)}`, 'Multiplicamos cada Lᵢ por su yᵢ, desarrollamos y agrupamos términos semejantes.');
  return { steps: S, input: pts.map(p => `(${H(p[0])}, ${H(p[1])})`).join(', '), result: `P(x) = ${H(P)}`, plot: { fns: [{ e: P, label: 'P(x)' }], x: 'x', dots: pts.map(p => [evalN(p[0]), evalN(p[1])]) } };
}
function newtonDD(s) {
  const pts = parsePoints(s); const n = pts.length; const S = [];
  const xs = pts.map(p => simplify(p[0])), T = [pts.map(p => simplify(p[1]))];
  for (let k = 1; k < n; k++) { const row = []; for (let i = 0; i < n - k; i++) row.push(simplify(M.Mul([M.Sub(T[k - 1][i + 1], T[k - 1][i]), M.Pow(M.Sub(xs[i + k], xs[i]), M.N(-1))]))); T.push(row); }

  const rows = xs.map((x, i) => [H(x)].concat(T.map(col => col[i] ? H(col[i], { inl: true }) : '')));
  step(S, 0, 'Tabla de diferencias divididas', table(head, rows), 'f[xᵢ, xᵢ₊₁] = (f[xᵢ₊₁] − f[xᵢ])/(xᵢ₊₁ − xᵢ), y así sucesivamente. Los coeficientes del polinomio son los primeros elementos de cada columna (la diagonal superior).');

  for (let k = 0; k < n; k++) { terms.push(M.Mul([T[k][0], ...prod])); prod = prod.concat([M.Sub(X, xs[k])]); }

  const P = M.expand(M.Add(terms));
  step(S, 0, 'Polinomio de Newton', `P(x) = ${form}`, 'P(x) = b₀ + b₁(x − x₀) + b₂(x − x₀)(x − x₁) + …');

  return { steps: S, input: pts.map(p => `(${H(p[0])}, ${H(p[1])})`).join(', '), result: `P(x) = ${H(P)}`, plot: { fns: [{ e: P, label: 'P(x)' }], x: 'x', dots: pts.map(p => [evalN(p[0]), evalN(p[1])]) } };

/* ---------- Regresión lineal (mínimos cuadrados) ---------- */
function regresion(s) {
  const pts = parsePoints(s).map(p => [evalN(p[0]), evalN(p[1])]); const n = pts.length; const S = [];

def simpson(f, a, b, n=10):
